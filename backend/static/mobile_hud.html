<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000814">
<title>JARVIS</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cyan: #00f2ff; --bg: #000814; --panel: rgba(8,20,40,0.95);
  --text: #cbd5e1; --muted: #475569; --border: rgba(0,242,255,0.18);
  --alert: #ef4444; --green: #22c55e; --purple: #a78bfa;
}
html, body {
  width: 100%; height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Courier New', monospace; overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
#app {
  display: flex; flex-direction: column; height: 100dvh;
  padding: env(safe-area-inset-top,12px) 0 env(safe-area-inset-bottom,0px);
}

/* topbar */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.brand { color: var(--cyan); font-size: 13px; letter-spacing: 5px; font-weight: 700; }
.sr { display: flex; align-items: center; gap: 8px; }
#mode-badge {
  font-size: 8px; letter-spacing: 2px; font-weight: 700; padding: 3px 8px;
  border-radius: 5px; background: rgba(0,242,255,.08); border: 1px solid var(--border); color: var(--cyan);
}
#mode-badge.sim { color: #fbbf24; border-color: rgba(251,191,36,.3); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--alert); }
.dot.on { background: var(--green); animation: blink 2s infinite; }
#conn-txt { font-size: 8px; letter-spacing: 2px; color: var(--muted); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* stats */
#stats {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 5px;
  padding: 8px 14px; flex-shrink: 0;
}
.sc { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; text-align: center; }
.sc-l { font-size: 7px; letter-spacing: 2px; color: var(--muted); }
.sc-v { font-size: 14px; font-weight: 700; color: var(--cyan); margin-top: 1px; }
.sc-v.warn { color: var(--alert); }
.sc-v.ok   { color: var(--green); }

/* weather strip */
#weather-strip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 3px 14px; font-size: 10px; color: var(--muted);
  border-bottom: 1px solid rgba(0,242,255,.07);
}
#weather-strip .wc { color: var(--cyan); font-weight: 700; }
#weather-strip .wm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* feed */
#feed-wrap { flex: 1; overflow-y: auto; padding: 10px 14px; scrollbar-width: none; }
#feed-wrap::-webkit-scrollbar { display: none; }
#feed { display: flex; flex-direction: column; gap: 10px; }

.mb { display: flex; flex-direction: column; gap: 3px; }
.mw { font-size: 8px; letter-spacing: 2px; padding: 0 4px; }
.mw.j { color: var(--cyan); } .mw.u { color: var(--purple); } .mw.s { color: var(--muted); }
.mt { font-size: 13px; line-height: 1.7; padding: 10px 13px; word-break: break-word; }
.mt.j { background: rgba(0,242,255,.05); border: 1px solid rgba(0,242,255,.14); border-radius: 4px 14px 14px 14px; }
.mt.u { background: rgba(167,139,250,.08); border: 1px solid rgba(167,139,250,.2); border-radius: 14px 4px 14px 14px; color: var(--purple); }
.mt.s { background: rgba(255,255,255,.03); color: var(--muted); font-size: 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,.06); }

.stream-cursor {
  display: inline-block; width: 2px; height: 0.9em; background: var(--cyan);
  margin-left: 2px; vertical-align: text-bottom;
  animation: cb .5s ease-in-out infinite;
}
@keyframes cb { 0%,100%{opacity:1} 50%{opacity:0} }

/* stt preview */
#stt-line { font-size: 11px; color: var(--cyan); padding: 2px 14px; min-height: 18px; flex-shrink: 0; }

/* mic button */
#mic-area { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 4px; }
#mic-btn {
  width: 78px; height: 78px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,242,255,.2), rgba(0,12,24,.96));
  border: 2px solid var(--cyan); display: flex; align-items: center; justify-content: center;
  font-size: 30px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  animation: pbtn 2.5s ease-in-out infinite; transition: transform .1s;
}
@keyframes pbtn {
  0%,100%{box-shadow:0 0 20px rgba(0,242,255,.3)}
  50%{box-shadow:0 0 40px rgba(0,242,255,.6),0 0 70px rgba(0,242,255,.15)}
}
#mic-btn.listening { border-color: var(--alert); animation: lp .5s ease-in-out infinite alternate; }
@keyframes lp { from{transform:scale(1);box-shadow:0 0 25px rgba(239,68,68,.6)} to{transform:scale(1.1);box-shadow:0 0 55px rgba(239,68,68,1)} }
#mic-btn.busy { opacity: .55; animation: none; }
#mic-btn:active { transform: scale(.91); }
#mic-hint { font-size: 9px; letter-spacing: 2px; color: var(--muted); }

/* quick */
#quick { flex-shrink: 0; display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; padding: 4px 14px 6px; }
.qb {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 4px; text-align: center; font-size: 10px; color: var(--text);
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  transition: background .1s, border-color .1s;
}
.qb:active { background: rgba(0,242,255,.1); border-color: var(--cyan); color: var(--cyan); }

/* input */
#input-bar {
  flex-shrink: 0; display: flex; gap: 8px; align-items: center;
  padding: 6px 14px calc(env(safe-area-inset-bottom,0px) + 8px);
  border-top: 1px solid var(--border);
}
#txt-input {
  flex: 1; background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 22px;
  padding: 11px 15px; font-size: 14px; font-family: inherit;
  outline: none; caret-color: var(--cyan);
}
#txt-input:focus { border-color: rgba(0,242,255,.5); }
#txt-input::placeholder { color: var(--muted); }
#send-btn {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  background: var(--cyan); border: none; cursor: pointer;
  font-size: 17px; color: var(--bg); font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(0,242,255,.5);
  transition: transform .1s; -webkit-tap-highlight-color: transparent;
}
#send-btn:active { transform: scale(.88); }
#send-btn:disabled { opacity: .3; transform: none; }

/* https overlay */
#https-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,8,20,.97); z-index: 999;
  flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 30px;
}
#https-overlay h2 { color: var(--cyan); font-size: 16px; letter-spacing: 3px; }
#https-overlay p  { color: var(--text); font-size: 13px; line-height: 1.8; text-align: center; }
#https-overlay a  {
  color: var(--bg); background: var(--cyan); padding: 12px 28px;
  border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none; letter-spacing: 2px;
}
</style>
</head>
<body>

<div id="https-overlay">
  <h2>🔒 HTTPS REQUIRED</h2>
  <p>마이크 및 실시간 스트리밍은<br>HTTPS 연결이 필요합니다.</p>
  <a id="https-link" href="#">HTTPS로 이동</a>
</div>

<div id="app">
  <div id="topbar">
    <div class="brand">JARVIS</div>
    <div class="sr">
      <span id="phone-bat" style="display:none;font-size:10px;color:var(--green);letter-spacing:1px;"></span>
      <div id="mode-badge">--</div>
      <div class="dot" id="dot"></div>
      <span id="conn-txt">CONNECTING</span>
    </div>
  </div>

  <div id="stats">
    <div class="sc"><div class="sc-l">CPU</div><div class="sc-v" id="s-cpu">--%</div></div>
    <div class="sc"><div class="sc-l">RAM</div><div class="sc-v" id="s-ram">--%</div></div>
    <div class="sc"><div class="sc-l">LAPTOP</div><div class="sc-v" id="s-bat">--%</div></div>
    <div class="sc"><div class="sc-l">DISK</div><div class="sc-v" id="s-disk">--%</div></div>
  </div>

  <div id="weather-strip">
    <span class="wc" id="w-temp">--°C</span>
    <span id="w-cond">--</span>
    <span class="wm" id="w-meal">급식: --</span>
  </div>

  <div id="feed-wrap"><div id="feed"></div></div>

  <div id="stt-line"></div>

  <div id="mic-area">
    <div id="mic-btn">🎙</div>
    <div id="mic-hint">HOLD TO SPEAK</div>
  </div>

  <div id="quick">
    <div class="qb" onclick="send('상태 보고해')">📊 상태</div>
    <div class="qb" onclick="triggerBriefing('morning')">🌅 모닝 브리핑</div>
    <div class="qb" onclick="startFocus()">🎯 집중</div>
    <div class="qb" onclick="send('내 폰 배터리 얼마야')">🔋 배터리</div>
    <div class="qb" onclick="reportGPS()">📍 GPS 동기화</div>
    <div class="qb" onclick="clearFeed()">🗑 초기화</div>
  </div>

  <div id="input-bar">
    <input id="txt-input" type="text" placeholder="명령을 입력하세요, Sir…"
      enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="send-btn" onclick="sendText()">▶</button>
  </div>
</div>

<script>
// ── HTTPS guard ───────────────────────────────────────────────────────────────
const IS_HTTPS = location.protocol === 'https:';
if (!IS_HTTPS && !['localhost','127.0.0.1'].includes(location.hostname)) {
  const ov = document.getElementById('https-overlay');
  document.getElementById('https-link').href = 'https://' + location.hostname + location.pathname;
  ov.style.display = 'flex';
}

// ── WebSocket — exponential backoff auto-reconnect ────────────────────────────
const WS_URL = `${IS_HTTPS ? 'wss' : 'ws'}://${location.host}/ws/stream`;
let ws, _retryMs = 1000, _retryTimer = null;
let _busy = false;  // true while LLM/TTS pipeline is running

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    _retryMs = 1000;
    _busy    = false;  // reset if WS dropped mid-stream
    document.getElementById('send-btn').disabled = false;
    setConn(true);
    reportPhoneBattery();
    reportGPS();
  };

  ws.onclose = () => {
    setConn(false);
    _retryTimer = setTimeout(connect, _retryMs);
    _retryMs    = Math.min(_retryMs * 2, 30000);
  };

  ws.onerror = () => ws.close();
  ws.onmessage = ({ data }) => onMsg(JSON.parse(data));
}
connect();

// Reconnect when screen unlocks / tab becomes visible
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ws.readyState !== WebSocket.OPEN) {
    clearTimeout(_retryTimer);
    _retryMs = 1000;
    connect();
  }
});

function setConn(ok) {
  document.getElementById('dot').className       = ok ? 'dot on' : 'dot';
  document.getElementById('conn-txt').textContent = ok ? 'LIVE' : 'RECONNECTING';
}

// ── Phone battery → server (feeds device context for LLM injection) ───────────
function reportPhoneBattery() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then(b => {
    const send = () => {
      if (ws?.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({
          type:    'phone_status',
          battery: Math.round(b.level * 100),
          charging: b.charging,
        }));
    };
    send();
    b.addEventListener('levelchange',    send);
    b.addEventListener('chargingchange', send);
  });
}

function reportGPS() {
  if (!navigator.geolocation) { sttLine('GPS 미지원'); return; }
  const opts = { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 };
  const send = pos => {
    if (ws?.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({
        type: 'phone_status',
        lat:  pos.coords.latitude,
        lon:  pos.coords.longitude,
      }));
    sttLine(`GPS ✓ (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`);
    setTimeout(() => sttLine(''), 3000);
  };
  const fail = err => {
    const msg = err.code === 1 ? 'GPS 권한 거부됨 — 설정에서 위치 허용 필요'
              : err.code === 2 ? 'GPS 신호 없음'
              : 'GPS 시간 초과';
    sttLine(msg);
    setTimeout(() => sttLine(''), 4000);
  };
  navigator.geolocation.getCurrentPosition(send, fail, opts);
  setInterval(() => navigator.geolocation.getCurrentPosition(send, () => {}, opts), 600000);
}

// ── Message dispatcher ────────────────────────────────────────────────────────
let _streamBubble = null;

function onMsg(msg) {
  switch (msg.type) {

    case 'connected': {
      const live = msg.mode !== 'SIM';
      const b    = document.getElementById('mode-badge');
      b.textContent = live ? 'LIVE' : 'SIM';
      b.className   = live ? '' : 'sim';
      addMsg('JARVIS', `Neural link online. Provider: ${msg.provider || 'groq'}. Voice + text streams ready, Sir.`, 'j');
      break;
    }

    case 'stt_processing':
      sttLine('음성 인식 중…');
      break;

    case 'stt_result':
      sttLine(msg.text || msg.error || '');
      if (msg.text) addMsg('YOU', msg.text, 'u');
      break;

    case 'stream_start':
      _streamBubble = createStreamBubble();
      break;

    case 'text_chunk':
      if (_streamBubble) {
        _streamBubble.span.textContent += msg.chunk;
        scrollFeed();
      }
      break;

    case 'text_done':
      if (_streamBubble) { _streamBubble.cur.remove(); _streamBubble = null; }
      sttLine('');
      scrollFeed();
      break;

    case 'audio_chunk':
      enqueueAudio(msg.data);
      break;

    case 'stream_done':
      _busy = false;
      document.getElementById('send-btn').disabled = false;
      break;

    case 'laptop_status':
      updateStats(msg);
      break;

    case 'proactive_alert':
      addMsg('⚠ JARVIS', msg.message, 's');
      break;

    case 'proactive_speak':
      // JARVIS initiated the conversation — show in feed
      addMsg('JARVIS', msg.text, 'j');
      break;

    case 'school_update':
      updateWeather(msg);
      break;

    case 'device_sync':
      if (msg.device === 'phone') updatePhoneBat(msg);
      break;
  }
}

function updatePhoneBat(msg) {
  const el = document.getElementById('phone-bat');
  if (!el) return;
  const pct = msg.battery ?? '--';
  const icon = msg.charging ? '⚡' : '🔋';
  el.textContent = `${icon} ${pct}%`;
  el.style.display = '';
  el.style.color = (typeof pct === 'number' && pct <= 20) ? 'var(--alert)' : 'var(--green)';
}

function updateWeather(d) {
  const temp = d.temp_c ?? d.temp;
  const cond = d.condition || '';
  const meal = d.meal_preview || '';
  if (temp !== undefined) document.getElementById('w-temp').textContent = temp + '°C';
  if (cond) document.getElementById('w-cond').textContent = cond;
  if (meal) document.getElementById('w-meal').textContent = '급식: ' + meal;
}

// ── Feed helpers ──────────────────────────────────────────────────────────────
const feedWrap = document.getElementById('feed-wrap');
const feed     = document.getElementById('feed');

function scrollFeed() { feedWrap.scrollTop = feedWrap.scrollHeight; }

function sttLine(t) { document.getElementById('stt-line').textContent = t; }

function addMsg(who, text, cls) {
  const b = document.createElement('div'); b.className = 'mb';
  b.innerHTML = `<div class="mw ${cls}">${who}</div><div class="mt ${cls}">${text}</div>`;
  feed.appendChild(b); scrollFeed();
}

function createStreamBubble() {
  const b = document.createElement('div'); b.className = 'mb';
  const w = document.createElement('div'); w.className = 'mw j'; w.textContent = 'JARVIS';
  const m = document.createElement('div'); m.className = 'mt j';
  const s = document.createElement('span');
  const c = document.createElement('span'); c.className = 'stream-cursor';
  m.appendChild(s); m.appendChild(c); b.appendChild(w); b.appendChild(m);
  feed.appendChild(b); scrollFeed();
  return { span: s, cur: c };
}

function clearFeed() {
  feed.innerHTML = '';
  fetch('/reset', { method: 'POST' });
  addMsg('SYSTEM', 'Conversation cleared, Sir.', 's');
}

async function triggerBriefing(trigger = 'morning') {
  addMsg('SYSTEM', '브리핑 요청 중…', 's');
  try {
    const resp = await fetch(`/proactive/trigger?trigger=${trigger}`, { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    addMsg('SYSTEM', 'JARVIS 브리핑이 전송되었습니다, Sir.', 's');
  } catch { addMsg('SYSTEM', '브리핑 요청 실패', 's'); }
}

async function startFocus() {
  try {
    const resp = await fetch('/focus/toggle', { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    const on = d.toggled === 'on';
    addMsg('SYSTEM', on ? '포모도로 25분 집중 세션 시작, Sir.' : '집중 세션 종료, Sir.', 's');
  } catch { send('집중 모드 시작'); }  // graceful fallback to chat
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats(d) {
  const set = (id, v, warn) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = v + '%';
    el.className   = 'sc-v' + (v >= warn ? ' warn' : v < warn - 35 ? ' ok' : '');
  };
  set('s-cpu', d.cpu, 85); set('s-ram', d.ram, 90); set('s-disk', d.disk, 90);
  const be = document.getElementById('s-bat');
  if (be) { be.textContent = d.bat + (d.plugged ? '%⚡' : '%'); be.className = 'sc-v' + (d.bat < 20 ? ' warn' : ''); }
}

// ── Text send ─────────────────────────────────────────────────────────────────
function send(text) {
  text = text.trim();
  if (!text || _busy || ws.readyState !== WebSocket.OPEN) return;
  _busy = true;
  document.getElementById('send-btn').disabled = true;
  addMsg('YOU', text, 'u');
  ws.send(JSON.stringify({ type: 'text', message: text }));
}

function sendText() {
  const el = document.getElementById('txt-input');
  const v  = el.value.trim();
  if (!v) return;
  el.value = '';
  send(v);
}

document.getElementById('txt-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendText();
});

// ── AudioContext queue — gapless sentence-level playback ──────────────────────
const audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
const audioQueue = [];
let   _playing   = false;

function enqueueAudio(b64) {
  audioQueue.push(b64);
  if (!_playing) _playNext();
}

function _playNext() {
  if (audioQueue.length === 0) { _playing = false; return; }
  _playing = true;
  const b64   = audioQueue.shift();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  audioCtx.decodeAudioData(bytes.buffer.slice(0),
    decoded => {
      const src = audioCtx.createBufferSource();
      src.buffer = decoded;
      src.connect(audioCtx.destination);
      src.start(0);
      src.onended = _playNext;
    },
    () => {
      // Fallback: HTMLAudio element (Safari MP3 quirks)
      const blob = new Blob([bytes], { type: 'audio/mpeg' });
      const url  = URL.createObjectURL(blob);
      const a    = new Audio(url);
      a.play().catch(() => {});
      a.onended = () => { URL.revokeObjectURL(url); _playNext(); };
    }
  );
}

// Safari requires AudioContext.resume() on user gesture
function _unlockAudio() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', _unlockAudio, { once: true });
document.addEventListener('click',      _unlockAudio, { once: true });

// ── Voice input — binary audio → /ws/stream ───────────────────────────────────
const micBtn  = document.getElementById('mic-btn');
const micHint = document.getElementById('mic-hint');
let _rec = null, _chunks = [], _recMime = '';

async function startVoice() {
  if (!IS_HTTPS || _rec || _busy || ws.readyState !== WebSocket.OPEN) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _recMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
             : MediaRecorder.isTypeSupported('audio/mp4')              ? 'audio/mp4' : '';
    _rec    = new MediaRecorder(stream, _recMime ? { mimeType: _recMime } : {});
    _chunks = [];
    _rec.ondataavailable = e => { if (e.data.size > 0) _chunks.push(e.data); };
    _rec.start(100);
    micBtn.classList.add('listening');
    micHint.textContent = '듣는 중…';
    _unlockAudio();
  } catch {
    micHint.textContent = '마이크 권한 필요';
    setTimeout(() => { micHint.textContent = 'HOLD TO SPEAK'; }, 2500);
  }
}

async function stopVoice() {
  if (!_rec || _rec.state === 'inactive') return;
  micBtn.classList.remove('listening');
  micBtn.classList.add('busy');
  micHint.textContent = '전송 중…';

  await new Promise(resolve => {
    _rec.onstop = resolve;
    _rec.stop();
    _rec.stream.getTracks().forEach(t => t.stop());
  });
  _rec = null;

  if (_chunks.length === 0) {
    micBtn.classList.remove('busy');
    micHint.textContent = 'HOLD TO SPEAK';
    return;
  }

  const mime = _recMime.includes('mp4') ? 'audio/mp4' : 'audio/webm';
  const blob = new Blob(_chunks, { type: mime });
  // Send raw audio bytes via WebSocket — server handles STT + pipeline
  ws.send(await blob.arrayBuffer());
  _busy = true;
  document.getElementById('send-btn').disabled = true;

  micBtn.classList.remove('busy');
  micHint.textContent = 'HOLD TO SPEAK';
}

if (IS_HTTPS) {
  micBtn.addEventListener('touchstart', e => { e.preventDefault(); startVoice(); });
  micBtn.addEventListener('touchend',   e => { e.preventDefault(); stopVoice();  });
  micBtn.addEventListener('mousedown',  () => startVoice());
  micBtn.addEventListener('mouseup',    () => stopVoice());
} else {
  micBtn.classList.add('busy');
  micHint.textContent = 'HTTPS 전용';
}

// ── Keep-alive ping ───────────────────────────────────────────────────────────
setInterval(() => {
  if (ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'ping' }));
}, 25000);
</script>
