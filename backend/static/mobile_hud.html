<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#00d4ff">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── Reset ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #000814;
  --cyan:   #00d4ff;
  --violet: #7c3aed;
  --panel:  rgba(0,14,32,0.84);
  --border: rgba(0,212,255,0.16);
  --text:   #c8d8e8;
  --muted:  #3a5272;
  --alert:  #ef4444;
  --green:  #22c55e;
  --amber:  #f59e0b;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  overflow: hidden; -webkit-text-size-adjust: 100%;
}

/* ── Background: grid + scanlines ─────────────────────────────────────────── */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.028) 1px, transparent 1px);
  background-size: 48px 48px;
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(
    0deg, rgba(0,0,0,0.055) 0px, rgba(0,0,0,0.055) 1px,
    transparent 1px, transparent 3px
  );
}

/* ── HTTPS overlay ────────────────────────────────────────────────────────── */
#https-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,8,20,0.97); z-index: 9999;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 30px;
}
#https-overlay h2 {
  color: var(--cyan); font-family: 'Orbitron', monospace;
  font-size: 13px; letter-spacing: 4px;
}
#https-overlay p { color: var(--text); font-size: 13px; line-height: 1.8; text-align: center; }
#https-overlay a {
  color: var(--bg); background: var(--cyan); padding: 12px 28px;
  border-radius: 8px; font-size: 11px; font-weight: 700;
  text-decoration: none; letter-spacing: 3px; font-family: 'Orbitron', monospace;
}

/* ── App ──────────────────────────────────────────────────────────────────── */
#app {
  display: flex; flex-direction: column; height: 100dvh;
  padding: env(safe-area-inset-top,12px) 0 env(safe-area-inset-bottom,0px);
  position: relative; z-index: 10;
}

/* ── Top bar ──────────────────────────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 16px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(0,4,14,0.7);
  backdrop-filter: blur(20px);
  box-shadow: 0 1px 0 rgba(0,212,255,0.1);
}
.brand {
  font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 900;
  letter-spacing: 6px;
  background: linear-gradient(90deg, var(--cyan) 0%, #a78bfa 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sr { display: flex; align-items: center; gap: 8px; }
#phone-bat { font-size: 9px; letter-spacing: 1px; color: var(--green); display: none; transition: opacity .4s, color .3s; }
#mode-badge {
  font-family: 'Orbitron', monospace; font-size: 7px; letter-spacing: 2px; font-weight: 700;
  padding: 2px 7px; border-radius: 3px;
  background: rgba(0,212,255,0.07); border: 1px solid var(--border); color: var(--cyan);
}
#mode-badge.sim { color: var(--amber); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.07); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--alert); flex-shrink: 0; }
.dot.on { background: var(--green); box-shadow: 0 0 7px var(--green); animation: blink 2.5s infinite; }
#conn-txt { font-size: 7px; letter-spacing: 2px; color: var(--muted); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Stats ────────────────────────────────────────────────────────────────── */
#stats {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 5px;
  padding: 8px 14px; flex-shrink: 0;
}
.sc {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 4px; text-align: center;
  backdrop-filter: blur(16px) saturate(1.2); position: relative; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,212,255,0.06) inset;
}
.sc::after {
  content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.45), transparent);
}
.sc-l { font-size: 6px; letter-spacing: 2px; color: var(--muted); font-family: 'Orbitron', monospace; }
.sc-v {
  font-size: 14px; font-weight: 700; color: var(--cyan); margin-top: 3px;
  font-family: 'Orbitron', monospace;
  text-shadow: 0 0 10px rgba(0,212,255,0.55);
}
.sc-v.warn { color: var(--alert); text-shadow: 0 0 10px rgba(239,68,68,0.55); }
.sc-v.ok   { color: var(--green); text-shadow: 0 0 10px rgba(34,197,94,0.55); }

/* ── Weather strip ────────────────────────────────────────────────────────── */
#weather-strip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 4px 14px; font-size: 9px; color: var(--muted);
  border-bottom: 1px solid rgba(0,212,255,0.06);
  background: rgba(0,212,255,0.018);
}
#weather-strip .wc {
  color: var(--cyan); font-weight: 700;
  font-family: 'Orbitron', monospace; font-size: 10px;
  text-shadow: 0 0 8px rgba(0,212,255,0.4);
}
#weather-strip .wm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Feed ─────────────────────────────────────────────────────────────────── */
#feed-wrap { flex: 1; overflow-y: auto; padding: 10px 14px; scrollbar-width: none; }
#feed-wrap::-webkit-scrollbar { display: none; }
#feed { display: flex; flex-direction: column; gap: 10px; }

.mb { display: flex; flex-direction: column; gap: 3px; }
.mw { font-size: 7px; letter-spacing: 2px; padding: 0 5px; font-family: 'Orbitron', monospace; }
.mw.j { color: var(--cyan); }
.mw.u { color: #a78bfa; text-align: right; }
.mw.s { color: var(--muted); text-align: center; }
.mt {
  font-size: 13px; line-height: 1.72; padding: 10px 13px;
  word-break: break-word; backdrop-filter: blur(10px);
}
.mt.j {
  background: rgba(0,212,255,0.05);
  border: 1px solid rgba(0,212,255,0.13);
  border-left: 2px solid rgba(0,212,255,0.55);
  border-radius: 2px 12px 12px 12px;
}
.mt.u {
  background: rgba(124,58,237,0.08);
  border: 1px solid rgba(124,58,237,0.2);
  border-right: 2px solid rgba(124,58,237,0.55);
  border-radius: 12px 2px 12px 12px;
  color: #c4b5fd;
}
.mt.s {
  background: rgba(255,255,255,0.02); color: var(--muted);
  font-size: 11px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.05); text-align: center;
}

.stream-cursor {
  display: inline-block; width: 2px; height: 0.88em;
  background: var(--cyan); margin-left: 2px; vertical-align: text-bottom;
  animation: cb .55s ease-in-out infinite;
}
@keyframes cb { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── STT line ─────────────────────────────────────────────────────────────── */
#stt-line {
  font-size: 10px; color: var(--cyan); padding: 2px 18px;
  min-height: 18px; flex-shrink: 0; letter-spacing: 1px;
}

/* ── Voice wave canvas ─────────────────────────────────────────────────────── */
#voice-wave { width: 100%; height: 44px; flex-shrink: 0; display: block; }

/* ── Mic area ─────────────────────────────────────────────────────────────── */
#mic-area {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 6px 0 2px;
}
#mic-btn {
  width: 80px; height: 80px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 38% 30%, rgba(0,212,255,0.22) 0%, rgba(0,8,20,0.97) 65%);
  border: 1.5px solid var(--cyan);
  box-shadow: 0 0 28px rgba(0,212,255,0.25), inset 0 1px 0 rgba(0,212,255,0.12);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  overflow: visible; transition: transform 0.12s, border-color 0.18s, box-shadow 0.18s;
}
/* Expanding rings */
.mic-ring {
  position: absolute; inset: -1px; border-radius: 50%;
  border: 1px solid rgba(0,212,255,0.55);
  animation: ring-expand 2.2s ease-out infinite;
  pointer-events: none;
}
.mic-ring.r2 { animation-delay: 0.9s; }
@keyframes ring-expand {
  0%   { transform: scale(1);   opacity: 0.6; }
  100% { transform: scale(2.5); opacity: 0; }
}
/* Mic SVG */
.mic-svg { stroke: var(--cyan); flex-shrink: 0; transition: stroke 0.18s; }

#mic-btn.listening {
  border-color: var(--alert);
  background: radial-gradient(circle at 38% 30%, rgba(239,68,68,0.22) 0%, rgba(0,8,20,0.97) 65%);
  box-shadow: 0 0 38px rgba(239,68,68,0.45);
}
#mic-btn.listening .mic-ring { border-color: rgba(239,68,68,0.55); animation-duration: 1.1s; }
#mic-btn.listening .mic-svg  { stroke: var(--alert); }
#mic-btn.busy { opacity: 0.45; }
#mic-btn.busy .mic-ring { display: none; }
#mic-btn:active { transform: scale(0.92); }

#mic-hint {
  font-size: 7px; letter-spacing: 3px; color: var(--muted);
  font-family: 'Orbitron', monospace;
}

/* ── Quick grid ───────────────────────────────────────────────────────────── */
#quick {
  flex-shrink: 0; display: grid; grid-template-columns: repeat(3,1fr);
  gap: 5px; padding: 4px 14px 5px;
}
.qb.clap-toggle {
  grid-column: span 3; flex-direction: row; gap: 8px; justify-content: center;
  border-color: rgba(0,212,255,0.15); transition: background .2s, border-color .2s, box-shadow .2s;
}
.qb.clap-toggle.active {
  background: rgba(0,212,255,0.10); border-color: rgba(0,212,255,0.55);
  box-shadow: 0 0 18px rgba(0,212,255,0.18);
}
.qb.clap-toggle.active .ql { color: var(--cyan); }
.qb.clap-toggle .ql { font-size: 8px; letter-spacing: 2px; }
.clap-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
  flex-shrink: 0; transition: background .2s, box-shadow .2s;
}
.qb.clap-toggle.active .clap-dot {
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 1.4s infinite;
}
.qb {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(10px);
  transition: background 0.1s, border-color 0.1s;
}
.qi { font-size: 15px; }
.ql { font-size: 7px; color: var(--muted); letter-spacing: 1px; transition: color 0.1s; }
.qb:active { background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.45); }
.qb:active .ql { color: var(--cyan); }

/* ── Input bar ────────────────────────────────────────────────────────────── */
#input-bar {
  flex-shrink: 0; display: flex; gap: 8px; align-items: center;
  padding: 6px 14px calc(env(safe-area-inset-bottom,0px) + 8px);
  border-top: 1px solid var(--border);
  background: rgba(0,4,14,0.7); backdrop-filter: blur(14px);
}
#txt-input {
  flex: 1; background: rgba(0,212,255,0.04); color: var(--text);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 11px 15px; font-size: 14px; font-family: inherit;
  outline: none; caret-color: var(--cyan);
  transition: border-color 0.2s, background 0.2s;
}
#txt-input:focus { border-color: rgba(0,212,255,0.45); background: rgba(0,212,255,0.06); }
#txt-input::placeholder { color: var(--muted); }
#send-btn {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--cyan) 0%, #0099c4 100%);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px rgba(0,212,255,0.5);
  transition: transform 0.12s, opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}
#send-btn:active   { transform: scale(0.88); }
#send-btn:disabled { opacity: 0.28; transform: none; cursor: default; }
</style>
</head>
<body>

<div id="https-overlay">
  <h2>HTTPS REQUIRED</h2>

<div id="app">
  <div id="topbar">

           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>

        <line x1="12" y1="19" x2="12" y2="22"/>

  <div id="quick">
    <div class="qb" onclick="send('상태 보고해')">

           stroke="#000814" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

      </svg>

<script>
// ── CLAP DETECTOR ────────────────────────────────────────────────────────────
class ClapDetector {
  constructor(onDouble) {
    this._onDouble = onDouble;
    this._active = false; this._paused = false;
    this._stream = null; this._actx = null;
    this._lastClap = 0; this._clapCount = 0; this._resetTimer = null;
  }
  async enable() {
    if (this._active) return;
    this._stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    this._actx = new AudioContext();
    const src = this._actx.createMediaStreamSource(this._stream);
    const analyser = this._actx.createAnalyser();
    analyser.fftSize = 512; analyser.smoothingTimeConstant = 0;
    src.connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    const THRESH = 0.22, COOLDOWN = 130, WIN = 600;
    let _inSpike = false, _lastDetect = 0;
    this._active = true;
    const tick = () => {
      if (!this._active) return;
      requestAnimationFrame(tick);
      if (this._paused) return;
      analyser.getFloatTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i]));
      const now = Date.now();
      if (peak > THRESH && !_inSpike && now - _lastDetect > COOLDOWN) {
        _inSpike = true; _lastDetect = now;
        const gap = now - this._lastClap;
        if (this._clapCount === 1 && gap < WIN) {
          clearTimeout(this._resetTimer);
          this._clapCount = 0; this._lastClap = 0;
          this._onDouble();
        } else {
          this._clapCount = 1; this._lastClap = now;
          clearTimeout(this._resetTimer);
          this._resetTimer = setTimeout(() => { this._clapCount = 0; }, WIN);
        }
      } else if (peak < THRESH * 0.15) { _inSpike = false; }
    };
    requestAnimationFrame(tick);
  }
  pause() { this._paused = true; }
  resume() { this._paused = false; }
  disable() {
    this._active = false; clearTimeout(this._resetTimer);
    this._stream?.getTracks().forEach(t => t.stop());
    this._actx?.close().catch(() => {});
    this._stream = null; this._actx = null; this._clapCount = 0;
  }
}

let _clapDetector = null;

async function toggleClap() {
  const btn = document.getElementById('clap-qb');
  const ql  = document.getElementById('clap-ql');
  if (_clapDetector) {
    _clapDetector.disable(); _clapDetector = null;
    btn.classList.remove('active');
    ql.textContent = 'CLAP MODE';
    sttLine(''); return;
  }
  sttLine('박수 모드 활성화 중…');
  try {
    _clapDetector = new ClapDetector(async () => {
      if (_busy || _rec || ws?.readyState !== WebSocket.OPEN) return;
      _clapDetector.pause();
      // Pulse mic button
      const mb = document.getElementById('mic-btn');
      mb.style.boxShadow = '0 0 60px rgba(0,212,255,0.9)';
      setTimeout(() => { mb.style.boxShadow = ''; }, 300);
      sttLine('👏 감지 — 말씀하세요, Sir…');
      await new Promise(r => setTimeout(r, 280));
      await startVoice();
      // Auto-stop after 5s or silence
      const MAX = 5000; const t0 = Date.now();
      await new Promise(res => {
        const id = setInterval(() => {
          if (!_rec || Date.now() - t0 > MAX) { clearInterval(id); res(); }
        }, 200);
      });
      if (_rec) await stopVoice();
      _clapDetector?.resume();
    });
    await _clapDetector.enable();
    btn.classList.add('active');
    ql.textContent = 'CLAP: ON';
    sttLine('👏 박수 두 번 → JARVIS 활성화');
    setTimeout(() => sttLine(''), 3000);
  } catch(e) {
    _clapDetector = null;
    sttLine('마이크 권한이 필요합니다');
    setTimeout(() => sttLine(''), 2500);
  }
}

// ── MARKDOWN STRIP + TYPER ────────────────────────────────────────────────────
function stripMd(s){
  if(!s)return'';
  return String(s)
    .replace(/```[\s\S]*?```/g,'')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/\*([^*]+)\*/g,'$1')
    .replace(/__([^_]+)__/g,'$1')
    .replace(/_([^_]+)_/g,'$1')
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^[>\s]*>\s*/gm,'')
    .replace(/^\s*[-*+]\s+/gm,'• ')
    .replace(/\[OPEN:[^\]]+\]/g,'')
    .trim();
}
class Typer{
  constructor(){this._q='';this._idx=0;this._span=null;this._t=null;this._cb=null;}
  attach(span,scrollCb){this._span=span;this._q='';this._idx=0;this._cb=scrollCb||null;}
  push(raw){
    this._q+=stripMd(raw);
    if(!this._t)this._run();
  }
  _run(){
    if(!this._span||this._idx>=this._q.length){this._t=null;return;}
    this._idx++;
    this._span.textContent=this._q.slice(0,this._idx);
    if(this._cb)this._cb();
    const ch=this._q[this._idx-1];
    const bl=this._q.length-this._idx;
    const base=bl>80?6:bl>20?14:22;
    const d=/[.!?]/.test(ch)?Math.max(base,65):/[,;:]/.test(ch)?Math.max(base,32):base;
    this._t=setTimeout(()=>this._run(),d);
  }
  flush(){
    clearTimeout(this._t);this._t=null;
    if(this._span&&this._idx<this._q.length){this._span.textContent=this._q;this._idx=this._q.length;}
    if(this._cb)this._cb();
  }
}
let _typer = new Typer();

// ── HTTPS guard ───────────────────────────────────────────────────────────────
const IS_HTTPS = location.protocol === 'https:';
if (!IS_HTTPS && !['localhost','127.0.0.1'].includes(location.hostname)) {
  const ov = document.getElementById('https-overlay');
  document.getElementById('https-link').href = 'https://' + location.hostname + location.pathname;
  ov.style.display = 'flex';
}

// ── WebSocket — exponential backoff auto-reconnect ────────────────────────────
const WS_URL = `${IS_HTTPS ? 'wss' : 'ws'}://${location.host}/ws/stream`;
let ws, _retryMs = 1000, _retryTimer = null;
let _busy = false;  // true while LLM/TTS pipeline is running

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    _retryMs = 1000;
    _busy    = false;  // reset if WS dropped mid-stream
    document.getElementById('send-btn').disabled = false;
    setConn(true);
    reportPhoneBattery();
    reportGPS();
  };

  ws.onclose = () => {
    setConn(false);
    _retryTimer = setTimeout(connect, _retryMs);
    _retryMs    = Math.min(_retryMs * 1.5, 3000);
  };

  ws.onerror = () => ws.close();
  ws.onmessage = ({ data }) => onMsg(JSON.parse(data));
}
connect();

// Reconnect when screen unlocks / tab becomes visible
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ws.readyState !== WebSocket.OPEN) {
    clearTimeout(_retryTimer);
    _retryMs = 1000;
    connect();
  }
});

function setConn(ok) {
  document.getElementById('dot').className       = ok ? 'dot on' : 'dot';
  document.getElementById('conn-txt').textContent = ok ? 'LIVE' : 'RECONNECTING';
}

// ── Phone battery → server (feeds device context for LLM injection) ───────────
function reportPhoneBattery() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then(b => {
    const send = () => {
      if (ws?.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({
          type:    'phone_status',
          battery: Math.round(b.level * 100),
          charging: b.charging,
        }));
    };
    send();
    b.addEventListener('levelchange',    send);
    b.addEventListener('chargingchange', send);
  });
}

let _gpsInterval = null;
function reportGPS() {
  if (!navigator.geolocation) { sttLine('GPS 미지원'); return; }
  const opts = { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 };
  const send = pos => {
    if (ws?.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({
        type: 'phone_status',
        lat:  pos.coords.latitude,
        lon:  pos.coords.longitude,
      }));
    sttLine(`GPS ✓ (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`);
    setTimeout(() => sttLine(''), 3000);
  };
  const fail = err => {
    const msg = err.code === 1 ? 'GPS 권한 거부됨 — 설정에서 위치 허용 필요'
              : err.code === 2 ? 'GPS 신호 없음'
              : 'GPS 시간 초과';
    sttLine(msg);
    setTimeout(() => sttLine(''), 4000);
  };
  navigator.geolocation.getCurrentPosition(send, fail, opts);
  // Clear previous interval to prevent accumulation on WS reconnect
  if (_gpsInterval) clearInterval(_gpsInterval);
  _gpsInterval = setInterval(() => navigator.geolocation.getCurrentPosition(send, () => {}, opts), 600000);
}

// ── Message dispatcher ────────────────────────────────────────────────────────
let _streamBubble = null;

function onMsg(msg) {
  switch (msg.type) {

    case 'connected': {
      const live = msg.mode !== 'SIM';
      const b    = document.getElementById('mode-badge');
      b.textContent = live ? 'LIVE' : 'SIM';
      b.className   = live ? '' : 'sim';
      addMsg('JARVIS', `Neural link online. Provider: ${msg.provider || 'groq'}. Voice + text streams ready, Sir.`, 'j');
      break;
    }

    case 'stt_processing':
      sttLine('음성 인식 중…');
      break;

    case 'stt_result':
      sttLine(msg.text || msg.error || '');
      if (msg.text) addMsg('YOU', msg.text, 'u');
      break;

    case 'stream_start':
      _streamBubble = createStreamBubble();
      break;

    case 'text_chunk':
      if (_streamBubble) {
        _typer.push(msg.chunk);
        scrollIfNearBottom();
      }
      break;

    case 'text_done':
      if (_streamBubble) { _typer.flush(); _streamBubble.cur.remove(); _streamBubble = null; }
      sttLine('');
      scrollIfNearBottom();
      break;

    case 'audio_chunk':
      enqueueAudio(msg.data);
      break;

    case 'stream_done':
      _busy = false;
      document.getElementById('send-btn').disabled = false;
      break;

    case 'laptop_status':
      updateStats(msg);
      break;

    case 'proactive_alert':
      addMsg('⚠ JARVIS', msg.message, 's');
      break;

    case 'proactive_speak':
      addMsg('JARVIS', msg.text, 'j');
      break;

    case 'agent_progress':
      sttLine(msg.message);
      break;

    case 'school_update':
      updateWeather(msg);
      break;

    case 'device_sync':
      if (msg.device === 'phone') updatePhoneBat(msg);
      break;
  }
}

function updatePhoneBat(msg) {
  const el = document.getElementById('phone-bat');
  if (!el) return;
  const pct = msg.battery ?? '--';
  const icon = msg.charging ? '⚡' : '🔋';
  el.textContent = `${icon} ${pct}%`;
  el.style.display = '';
  el.style.color = (typeof pct === 'number' && pct <= 20) ? 'var(--alert)' : 'var(--green)';
}

function updateWeather(d) {
  const temp = d.temp_c ?? d.temp;
  const cond = d.condition || '';
  const meal = d.meal_preview || '';
  if (temp !== undefined) document.getElementById('w-temp').textContent = temp + '°C';
  if (cond) document.getElementById('w-cond').textContent = cond;
  if (meal) document.getElementById('w-meal').textContent = '급식: ' + meal;
}

// ── Feed helpers ──────────────────────────────────────────────────────────────
const feedWrap = document.getElementById('feed-wrap');
const feed     = document.getElementById('feed');

function _nearBottom() { return feedWrap.scrollHeight - feedWrap.scrollTop - feedWrap.clientHeight < 80; }
function scrollFeed()        { feedWrap.scrollTop = feedWrap.scrollHeight; }
function scrollIfNearBottom() { if (_nearBottom()) scrollFeed(); }

function sttLine(t) { document.getElementById('stt-line').textContent = t; }

function addMsg(who, text, cls) {
  const b = document.createElement('div'); b.className = 'mb';
  const body = cls === 'j' ? stripMd(text) : text;
  b.innerHTML = `<div class="mw ${cls}">${who}</div><div class="mt ${cls}">${body}</div>`;
  feed.appendChild(b); scrollIfNearBottom();
}

function createStreamBubble() {
  const b = document.createElement('div'); b.className = 'mb';
  const w = document.createElement('div'); w.className = 'mw j'; w.textContent = 'JARVIS';
  const m = document.createElement('div'); m.className = 'mt j';
  const s = document.createElement('span');
  const c = document.createElement('span'); c.className = 'stream-cursor';
  m.appendChild(s); m.appendChild(c); b.appendChild(w); b.appendChild(m);
  feed.appendChild(b); scrollIfNearBottom();
  _typer.attach(s, scrollIfNearBottom);
  return { span: s, cur: c };
}

function clearFeed() {
  feed.innerHTML = '';
  fetch('/reset', { method: 'POST' });
  addMsg('SYSTEM', 'Conversation cleared, Sir.', 's');
}

async function triggerBriefing(trigger = 'morning') {
  addMsg('SYSTEM', '브리핑 요청 중…', 's');
  try {
    const resp = await fetch(`/proactive/trigger?trigger=${trigger}`, { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    addMsg('SYSTEM', 'JARVIS 브리핑이 전송되었습니다, Sir.', 's');
  } catch { addMsg('SYSTEM', '브리핑 요청 실패', 's'); }
}

async function startFocus() {
  try {
    const resp = await fetch('/focus/toggle', { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    const on = d.toggled === 'on';
    addMsg('SYSTEM', on ? '포모도로 25분 집중 세션 시작, Sir.' : '집중 세션 종료, Sir.', 's');
  } catch { send('집중 모드 시작'); }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats(d) {
  const set = (id, v, warn) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = v + '%';
    el.className   = 'sc-v' + (v >= warn ? ' warn' : v < warn - 35 ? ' ok' : '');
  };
  set('s-cpu', d.cpu, 85); set('s-ram', d.ram, 90); set('s-disk', d.disk, 90);
  const be = document.getElementById('s-bat');
  if (be) { be.textContent = d.bat + (d.plugged ? '%⚡' : '%'); be.className = 'sc-v' + (d.bat < 20 ? ' warn' : ''); }
}

// ── Text send ─────────────────────────────────────────────────────────────────
function send(text) {
  text = text.trim();
  if (!text || _busy || ws.readyState !== WebSocket.OPEN) return;
  _busy = true;
  document.getElementById('send-btn').disabled = true;
  addMsg('YOU', text, 'u');
  scrollFeed();
  ws.send(JSON.stringify({ type: 'text', message: text }));
}

function sendText() {
  const el = document.getElementById('txt-input');
  const v  = el.value.trim();
  if (!v) return;
  el.value = '';
  send(v);
}

document.getElementById('txt-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendText();
});

// ── AudioContext queue — gapless sentence-level playback ──────────────────────
const audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
const analyserNode = audioCtx.createAnalyser();
analyserNode.fftSize = 256; analyserNode.smoothingTimeConstant = 0.88;
analyserNode.connect(audioCtx.destination);
const _waveData = new Uint8Array(analyserNode.frequencyBinCount);
const audioQueue = [];
let   _playing   = false;
let   _currentSrc = null;
let   _waveAmp = 0, _waveT = 0;

function stopAudio() {
  audioQueue.length = 0;
  _playing = false;
  if (_currentSrc) {
    try { _currentSrc.stop(); } catch(e) {}
    _currentSrc = null;
  }
}

function enqueueAudio(b64) {
  audioQueue.push(b64);
  if (!_playing) _playNext();
}

function _playNext() {
  if (audioQueue.length === 0) { _playing = false; _currentSrc = null; return; }
  _playing = true;
  const b64   = audioQueue.shift();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  audioCtx.decodeAudioData(bytes.buffer.slice(0),
    decoded => {
      const src = audioCtx.createBufferSource();
      _currentSrc = src;
      src.buffer = decoded;
      src.connect(analyserNode); analyserNode.connect(audioCtx.destination);
      src.start(0);
      src.onended = _playNext;
    },
    () => {
      const blob = new Blob([bytes], { type: 'audio/mpeg' });
      const url  = URL.createObjectURL(blob);
      const a    = new Audio(url);
      a.play().catch(() => {});
      a.onended = () => { URL.revokeObjectURL(url); _playNext(); };
    }
  );
}

function _unlockAudio() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', _unlockAudio, { passive: true });
document.addEventListener('click',      _unlockAudio);

// ── Voice input — binary audio → /ws/stream ───────────────────────────────────
const micBtn  = document.getElementById('mic-btn');
const micHint = document.getElementById('mic-hint');
let _rec = null, _micStream = null, _chunks = [], _recMime = '';

async function startVoice() {
  if (!IS_HTTPS || _rec || _busy || ws.readyState !== WebSocket.OPEN) return;
  stopAudio();
  try {
    // Reuse existing stream to avoid repeated iOS permission prompts
    if (!_micStream || _micStream.getTracks().some(t => t.readyState === 'ended')) {
      _micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 },
      });
    }
    _recMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
             : MediaRecorder.isTypeSupported('audio/mp4')              ? 'audio/mp4' : '';
    _rec    = new MediaRecorder(_micStream, _recMime ? { mimeType: _recMime } : {});
    _chunks = [];
    _rec.ondataavailable = e => { if (e.data.size > 0) _chunks.push(e.data); };
    _rec.start(100);
    micBtn.classList.add('listening');
    micHint.textContent = '듣는 중…';
    _unlockAudio();
  } catch {
    _micStream = null;  // force re-acquire on next attempt
    micHint.textContent = '마이크 권한 필요';
    setTimeout(() => { micHint.textContent = 'HOLD TO SPEAK'; }, 2500);
  }
}

async function stopVoice() {
  if (!_rec || _rec.state === 'inactive') return;
  micBtn.classList.remove('listening');
  micBtn.classList.add('busy');
  micHint.textContent = '전송 중…';

  await new Promise(resolve => {
    _rec.onstop = resolve;
    _rec.stop();
    // Keep _micStream alive — iOS reuses the existing permission grant
  });
  _rec = null;

  if (_chunks.length === 0) {
    micBtn.classList.remove('busy');
    micHint.textContent = 'HOLD TO SPEAK';
    return;
  }

  const mime = _recMime.includes('mp4') ? 'audio/mp4' : 'audio/webm';
  const blob = new Blob(_chunks, { type: mime });
  ws.send(await blob.arrayBuffer());
  _busy = true;
  document.getElementById('send-btn').disabled = true;

  micBtn.classList.remove('busy');
  micHint.textContent = 'HOLD TO SPEAK';
}

if (IS_HTTPS) {
  micBtn.addEventListener('touchstart', e => { e.preventDefault(); startVoice(); });
  micBtn.addEventListener('touchend',   e => { e.preventDefault(); stopVoice();  });
  micBtn.addEventListener('mousedown',  () => startVoice());
  micBtn.addEventListener('mouseup',    () => stopVoice());
} else {
  micBtn.classList.add('busy');
  micHint.textContent = 'HTTPS 전용';
}

// ── Keep-alive ping ───────────────────────────────────────────────────────────
setInterval(() => {
  if (ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'ping' }));
}, 25000);

// ── Voice waveform RAF loop (30fps) ──────────────────────────────────────────
{
  const wvc = document.getElementById('voice-wave');
  const wvctx = wvc.getContext('2d');
  let _wvLast = 0;
  function _drawVoiceWave(ts) {
    requestAnimationFrame(_drawVoiceWave);
    if (ts - _wvLast < 33) return;
    _wvLast = ts;
    const w = wvc.offsetWidth, h = 44;
    if (wvc.width !== w) { wvc.width = w; wvc.height = h; }
    wvctx.clearRect(0, 0, w, h);
    const mid = h / 2;
    if (_playing) {
      _waveAmp = Math.min(1, _waveAmp + 0.05);
      analyserNode.getByteTimeDomainData(_waveData);
      const grad = wvctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, 'rgba(0,212,255,0)');
      grad.addColorStop(0.15, 'rgba(0,212,255,' + _waveAmp + ')');
      grad.addColorStop(0.5, 'rgba(200,255,255,' + _waveAmp + ')');
      grad.addColorStop(0.85, 'rgba(0,212,255,' + _waveAmp + ')');
      grad.addColorStop(1, 'rgba(0,212,255,0)');
      wvctx.beginPath();
      wvctx.strokeStyle = grad;
      wvctx.lineWidth = _waveAmp > 0.5 ? 2.2 : 1.0 + _waveAmp * 2.4;
      for (let x = 0; x < w; x++) {
        const idx = Math.floor((x / w) * _waveData.length);
        const v = (_waveData[idx] - 128) / 128;
        const y = mid + v * mid * 0.85 * _waveAmp;
        x === 0 ? wvctx.moveTo(x, y) : wvctx.lineTo(x, y);
      }
      wvctx.stroke();
    } else {
      _waveAmp = Math.max(0, _waveAmp - 0.02);
      wvctx.globalAlpha = 0.25;
      wvctx.beginPath();
      wvctx.strokeStyle = '#00d4ff';
      wvctx.lineWidth = 1.0;
      for (let x = 0; x < w; x++) {
        const amp = Math.sin(_waveT * 0.03 + x * 0.4) * 6 + Math.sin(_waveT * 0.07 + x * 0.15) * 4;
        const y = mid + amp * Math.sin(x * 0.055 + _waveT * 0.045) * 0.5;
        x === 0 ? wvctx.moveTo(x, y) : wvctx.lineTo(x, y);
      }
      wvctx.stroke();
      wvctx.globalAlpha = 1.0;
      _waveT += 2;
    }
  }
  requestAnimationFrame(_drawVoiceWave);
}
</script>
