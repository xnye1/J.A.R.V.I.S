<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000814">
<title>JARVIS Remote</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cyan: #00f2ff; --bg: #000814; --panel: rgba(10,22,40,0.92);
  --text: #cbd5e1; --muted: #475569; --border: rgba(0,242,255,0.2);
  --alert: #ef4444; --purple: #a78bfa; --green: #22c55e;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Courier New', monospace;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ── Layout ─────────────────────────────────────────────────────────── */
#app {
  display: flex; flex-direction: column; height: 100dvh;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}

/* ── Top bar ─────────────────────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand { color: var(--cyan); font-size: 14px; letter-spacing: 4px; font-weight: 700; }
.status-row { display: flex; align-items: center; gap: 10px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--alert); flex-shrink: 0; }
.dot.on { background: var(--green); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
#conn-label { font-size: 9px; letter-spacing: 2px; color: var(--muted); }
#chip-mode {
  font-size: 9px; letter-spacing: 2px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px;
  background: rgba(0,242,255,.08); border: 1px solid var(--border);
  color: var(--cyan);
}
#chip-mode.sim { color: #fbbf24; border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.07); }

/* ── Chat feed ───────────────────────────────────────────────────────── */
#feed-wrap {
  flex: 1; overflow-y: auto; padding: 12px 14px;
  scrollbar-width: none;
}
#feed-wrap::-webkit-scrollbar { display: none; }
#feed { display: flex; flex-direction: column; gap: 10px; }

.msg-block { display: flex; flex-direction: column; gap: 3px; }
.msg-who { font-size: 8px; letter-spacing: 2px; padding: 0 4px; }
.msg-who.j { color: var(--cyan); }
.msg-who.u { color: var(--purple); }
.msg-who.s { color: var(--muted); }
.msg-text {
  font-size: 13px; line-height: 1.65; padding: 9px 12px;
  border-radius: 4px 14px 14px 14px; word-break: break-word;
}
.msg-text.j { background: rgba(0,242,255,.06); border: 1px solid rgba(0,242,255,.15); color: var(--text); }
.msg-text.u { background: rgba(167,139,250,.08); border: 1px solid rgba(167,139,250,.2); color: var(--purple); border-radius: 14px 4px 14px 14px; }
.msg-text.s { background: rgba(255,255,255,.03); color: var(--muted); font-size: 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,.06); }
.stream-cursor {
  display: inline-block; width: 2px; height: 0.9em;
  background: var(--cyan); margin-left: 2px; vertical-align: text-bottom;
  animation: cur-blink 0.55s ease-in-out infinite;
}
@keyframes cur-blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── Weather strip ───────────────────────────────────────────────────── */
#weather-strip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 4px 14px; font-size: 10px;
  border-bottom: 1px solid rgba(0,242,255,.07);
}

/* ── Laptop stats strip ──────────────────────────────────────────────── */
#laptop-stats {
  flex-shrink: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  padding: 0 14px;
}
.stat-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 7px 6px; text-align: center;
}
.stat-label { font-size: 7px; letter-spacing: 2px; color: var(--muted); }
.stat-val   { font-size: 15px; font-weight: 700; color: var(--cyan); margin-top: 2px; }
.stat-val.warn  { color: var(--alert); }
.stat-val.ok    { color: var(--green); }

/* ── Voice button ────────────────────────────────────────────────────── */
#voice-area {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 8px 0 4px;
}
#voice-btn {
  width: 76px; height: 76px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,242,255,.18), rgba(0,12,24,.95));
  border: 2px solid var(--cyan);
  box-shadow: 0 0 22px rgba(0,242,255,.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 30px; user-select: none;
  transition: transform .15s;
  -webkit-tap-highlight-color: transparent;
  animation: pb 2.5s ease-in-out infinite;
}
@keyframes pb {
  0%,100%{box-shadow:0 0 22px rgba(0,242,255,.35)}
  50%{box-shadow:0 0 42px rgba(0,242,255,.65),0 0 70px rgba(0,242,255,.15)}
}
#voice-btn.listening {
  animation: lp .55s ease-in-out infinite alternate;
}
@keyframes lp {
  from{transform:scale(1);box-shadow:0 0 28px rgba(0,242,255,.6)}
  to{transform:scale(1.1);box-shadow:0 0 55px rgba(0,242,255,1)}
}
#voice-btn:active { transform: scale(.9); }
#voice-btn.disabled { opacity: .35; pointer-events: none; }
#voice-hint { font-size: 9px; letter-spacing: 2px; color: var(--muted); }
#https-note {
  font-size: 9px; color: #fbbf24; letter-spacing: 1px; text-align: center;
  padding: 4px 16px; display: none;
}
#https-note a { color: #fbbf24; }

/* ── Quick actions ───────────────────────────────────────────────────── */
#quick {
  flex-shrink: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
  padding: 4px 14px 6px;
}
.qbtn {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 6px; text-align: center; cursor: pointer;
  font-size: 11px; color: var(--text); letter-spacing: .5px;
  transition: background .12s, border-color .12s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.qbtn:active { background: rgba(0,242,255,.1); border-color: var(--cyan); color: var(--cyan); }
.qbtn.wide { grid-column: span 2; letter-spacing: 2px; font-weight: 700; border-color: rgba(167,139,250,.4); color: var(--purple); }
.qbtn.wide:active { background: rgba(167,139,250,.12); border-color: var(--purple); }

/* ── Bottom controls ─────────────────────────────────────────────────── */
#controls {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 4px 14px 6px;
}
#reactor-btn {
  flex-shrink: 0;
  background: var(--panel); border: 1px solid rgba(0,242,255,.25); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; font-size: 10px; letter-spacing: 1px;
  color: var(--cyan); -webkit-tap-highlight-color: transparent; user-select: none;
  white-space: nowrap;
}
#reactor-btn:active { background: rgba(0,242,255,.12); }
#tts-btn {
  flex-shrink: 0;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 10px; cursor: pointer; font-size: 10px; letter-spacing: 1px;
  color: var(--muted); -webkit-tap-highlight-color: transparent; user-select: none;
}
#tts-btn.on { color: var(--cyan); border-color: rgba(0,242,255,.4); }
#tts-btn:active { background: rgba(0,242,255,.1); }

/* ── Input row ───────────────────────────────────────────────────────── */
#input-row {
  flex-shrink: 0;
  display: flex; gap: 8px; align-items: center;
  padding: 6px 14px calc(env(safe-area-inset-bottom,0px) + 8px);
  border-top: 1px solid var(--border);
}
#msg-input {
  flex: 1; background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 24px;
  padding: 12px 16px; font-size: 14px; font-family: inherit;
  outline: none; caret-color: var(--cyan);
}
#msg-input::placeholder { color: var(--muted); }
#msg-input:focus { border-color: rgba(0,242,255,.5); }
#send-btn {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: var(--cyan); border: none; cursor: pointer;
  font-size: 18px; color: var(--bg); font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px rgba(0,242,255,.5);
  transition: transform .12s; -webkit-tap-highlight-color: transparent;
}
#send-btn:active { transform: scale(.88); }
#send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
</style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div id="topbar">
    <div class="brand">J.A.R.V.I.S</div>
    <div class="status-row">
      <div id="chip-mode">--</div>
      <div class="dot" id="conn-dot"></div>
      <span id="conn-label">CONNECTING</span>
    </div>
  </div>

  <!-- Chat feed -->
  <div id="feed-wrap"><div id="feed"></div></div>

  <!-- Weather / meal strip -->
  <div id="weather-strip">
    <span id="r-temp" style="color:var(--cyan);font-weight:700">--°C</span>
    <span id="r-cond" style="color:var(--muted)">--</span>
    <span id="r-meal" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)">급식: --</span>
  </div>

  <!-- Laptop stats -->
  <div id="laptop-stats">
    <div class="stat-card">
      <div class="stat-label">CPU</div>
      <div class="stat-val" id="ls-cpu">--%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">RAM</div>
      <div class="stat-val" id="ls-ram">--%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">LAPTOP</div>
      <div class="stat-val" id="ls-bat">--%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">DISK</div>
      <div class="stat-val" id="ls-disk">--%</div>
    </div>
  </div>

  <!-- Voice button -->
  <div id="voice-area">
    <div id="voice-btn">🎙</div>
    <div id="voice-hint">HOLD TO SPEAK</div>
    <div id="https-note">음성 사용: <a id="https-link" href="#">HTTPS 버전으로 이동</a></div>
  </div>

  <!-- Quick actions -->
  <div id="quick">
    <div class="qbtn" onclick="quickSend('상태 보고해')">📊 상태 보고</div>
    <div class="qbtn" onclick="triggerBriefing('morning')">🌅 모닝 브리핑</div>
    <div class="qbtn" onclick="toggleFocus()">🎯 집중 모드</div>
    <div class="qbtn" onclick="resetConv()">🔄 초기화</div>
    <div class="qbtn wide" onclick="sendTestSignal()">⚡ HUD 연결 테스트</div>
  </div>

  <!-- Controls row -->
  <div id="controls">
    <div id="reactor-btn" onclick="toggleReactor()">⚡ REACTOR: ONLINE</div>
    <div id="tts-btn" onclick="toggleTTS()">🔊 TTS</div>
  </div>

  <!-- Text input -->
  <div id="input-row">
    <input id="msg-input" type="text" placeholder="명령을 내리십시오, Sir…"
      enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="send-btn" onclick="sendText()">▶</button>
  </div>

</div>
<script>
// Auto-redirect HTTP → HTTPS so microphone access works
if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  location.replace('https://' + location.hostname + location.pathname);
}

// ── Connection ────────────────────────────────────────────────────────────────
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
const IS_HTTPS = location.protocol === 'https:';
let ws, reactorOn = true, ttsEnabled = false;
let _streaming = false, _mediaRec = null, _audioChunks = [], _recMime = '';

// ── HTTPS note for voice ──────────────────────────────────────────────────────
if (!IS_HTTPS) {
  const note = document.getElementById('https-note');
  const link = document.getElementById('https-link');
  note.style.display = 'block';
  // Replace port 8000 with port 443
  const httpsUrl = 'https://' + location.hostname + '/remote';
  link.href = httpsUrl;
  link.textContent = httpsUrl;
  document.getElementById('voice-btn').classList.add('disabled');
  document.getElementById('voice-hint').textContent = 'HTTPS 전용';
}

// ── Feed helpers ──────────────────────────────────────────────────────────────
const feed = document.getElementById('feed');
const feedWrap = document.getElementById('feed-wrap');

function addMsg(who, text, cls) {
  const block = document.createElement('div');
  block.className = 'msg-block';
  block.innerHTML = `<div class="msg-who ${cls}">${who}</div><div class="msg-text ${cls}">${text}</div>`;
  feed.appendChild(block);
  feedWrap.scrollTop = feedWrap.scrollHeight;
}

function createStreamBubble() {
  const block = document.createElement('div'); block.className = 'msg-block';
  const who   = document.createElement('div'); who.className = 'msg-who j'; who.textContent = 'JARVIS';
  const wrap  = document.createElement('div'); wrap.className = 'msg-text j';
  const span  = document.createElement('span');
  const cur   = document.createElement('span'); cur.className = 'stream-cursor';
  wrap.appendChild(span); wrap.appendChild(cur);
  block.appendChild(who); block.appendChild(wrap);
  feed.appendChild(block);
  feedWrap.scrollTop = feedWrap.scrollHeight;
  return { span, cur };
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connect() {
  ws = new WebSocket(WS_URL);
  const dot = document.getElementById('conn-dot');
  const lbl = document.getElementById('conn-label');

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'register', device: 'remote' }));
    dot.className = 'dot on'; lbl.textContent = 'ONLINE';
    _streaming = false;  // reset if WS dropped mid-stream
    document.getElementById('send-btn').disabled = false;
    reportBattery();
    reportGPS();
  };

  ws.onclose = () => {
    dot.className = 'dot'; lbl.textContent = 'OFFLINE';
    setTimeout(connect, 3000);
  };

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'connected') {
      const live = !msg.simulation_mode;
      const m = document.getElementById('chip-mode');
      m.textContent = live ? 'LIVE' : 'SIM';
      m.className = live ? '' : 'sim';
      addMsg('JARVIS', 'Neural link established, Sir. Awaiting your command.', 'j');
    } else if (msg.type === 'proactive_alert') {
      addMsg('⚠ ALERT', msg.message, 's');
    } else if (msg.type === 'reactor_state') {
      applyReactor(msg.energy_saving);
    } else if (msg.type === 'laptop_status') {
      updateLaptopStats(msg);
    } else if (msg.type === 'school_update') {
      updateWeatherChip(msg);
    }
  };
}
connect();

// ── Battery ───────────────────────────────────────────────────────────────────
function reportBattery() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then(b => {
    const send = () => {
      if (ws?.readyState === 1)
        ws.send(JSON.stringify({ type: 'remote_status', battery: Math.round(b.level*100), plugged: b.charging }));
    };
    send();
    b.addEventListener('levelchange', send);
    b.addEventListener('chargingchange', send);
  });
}

function reportGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    if (ws?.readyState === 1)
      ws.send(JSON.stringify({ type: 'location', lat, lon, source: 'gps' }));
  }, () => {});  // silent on deny
  // Re-report every 10 minutes
  setInterval(() => {
    navigator.geolocation.getCurrentPosition(pos => {
      if (ws?.readyState === 1)
        ws.send(JSON.stringify({ type: 'location', lat: pos.coords.latitude, lon: pos.coords.longitude, source: 'gps' }));
    }, () => {});
  }, 600000);
}

// ── Laptop stats ──────────────────────────────────────────────────────────────
function updateLaptopStats(d) {
  const set = (id, val, warnThreshold) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = val + '%';
    el.className = 'stat-val' + (val >= warnThreshold ? ' warn' : val < warnThreshold - 30 ? ' ok' : '');
  };
  set('ls-cpu',  d.cpu,  85);
  set('ls-ram',  d.ram,  90);
  set('ls-disk', d.disk, 90);
  const batEl = document.getElementById('ls-bat');
  if (batEl) {
    batEl.textContent = d.bat + (d.plugged ? '%⚡' : '%');
    batEl.className   = 'stat-val' + (d.bat < 20 ? ' warn' : '');
  }
}

// ── Weather / meal chip ───────────────────────────────────────────────────────
function updateWeatherChip(d) {
  const temp = d.temp_c ?? d.temp;
  if (temp !== undefined) document.getElementById('r-temp').textContent = temp + '°C';
  if (d.condition) document.getElementById('r-cond').textContent = d.condition;
  if (d.meal_preview) document.getElementById('r-meal').textContent = '급식: ' + d.meal_preview;
}

// ── Send (streaming) ──────────────────────────────────────────────────────────
async function sendMsg(text) {
  text = text.trim();
  if (!text || _streaming) return;
  _streaming = true;
  document.getElementById('send-btn').disabled = true;

  addMsg('YOU', text, 'u');
  if (ws?.readyState === 1)
    ws.send(JSON.stringify({ type: 'remote_speaking', message: text }));

  const bubble = createStreamBubble();
  let fullReply = '';

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const reader = resp.body.getReader();
    const dec    = new TextDecoder();
    let   buf    = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        try {
          const obj = JSON.parse(p.slice(6));
          if (obj.done) { reader.cancel(); break; }
          fullReply += obj.chunk;
          bubble.span.textContent = fullReply;
          feedWrap.scrollTop = feedWrap.scrollHeight;
        } catch {}
      }
    }
  } catch {
    fullReply = '통신 오류가 발생했습니다, Sir.';
    bubble.span.textContent = fullReply;
  }

  bubble.cur.remove();
  feedWrap.scrollTop = feedWrap.scrollHeight;

  speak(fullReply);

  if (ws?.readyState === 1)
    ws.send(JSON.stringify({ type: 'hud_echo', query: text, message: fullReply }));

  _streaming = false;
  document.getElementById('send-btn').disabled = false;
}

function sendText() {
  const inp = document.getElementById('msg-input');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  sendMsg(val);
}

function quickSend(text) { sendMsg(text); }

async function triggerBriefing(trigger = 'morning') {
  addMsg('SYSTEM', '브리핑 요청 중…', 's');
  try {
    const resp = await fetch(`/proactive/trigger?trigger=${trigger}`, { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    addMsg('SYSTEM', 'JARVIS 브리핑이 전송되었습니다, Sir.', 's');
  } catch { addMsg('SYSTEM', '브리핑 요청 실패', 's'); }
}

async function toggleFocus() {
  try {
    const resp = await fetch('/focus/toggle', { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    const on = d.toggled === 'on';
    if (ws?.readyState === 1)
      ws.send(JSON.stringify({ type: on ? 'focus_start' : 'focus_end', minutes: 25 }));
    addMsg('SYSTEM', on ? '포모도로 25분 집중 세션 시작, Sir.' : '집중 세션 종료, Sir.', 's');
  } catch { quickSend('집중 모드 시작해줘'); }
}

function sendTestSignal() {
  if (ws?.readyState !== 1) { addMsg('SYSTEM', 'WS 연결이 없습니다.', 's'); return; }
  ws.send(JSON.stringify({ type: 'test_signal' }));
  addMsg('SYSTEM', 'Test signal → HUD.', 's');
}

async function resetConv() {
  await fetch('/reset', { method: 'POST' });
  feed.innerHTML = '';
  addMsg('SYSTEM', 'Conversation cleared, Sir.', 's');
}

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendText();
});

// ── Reactor ───────────────────────────────────────────────────────────────────
function applyReactor(energySaving) {
  reactorOn = !energySaving;
  const btn = document.getElementById('reactor-btn');
  btn.textContent = energySaving ? '⚡ REACTOR: SAVING' : '⚡ REACTOR: ONLINE';
  btn.style.color  = energySaving ? '#fbbf24' : 'var(--cyan)';
  btn.style.borderColor = energySaving ? 'rgba(251,191,36,.4)' : 'rgba(0,242,255,.25)';
}

function toggleReactor() {
  const newSaving = reactorOn; // reactorOn=true means currently full power, toggling → save
  if (ws?.readyState === 1)
    ws.send(JSON.stringify({ type: 'reactor_toggle', energy_saving: newSaving }));
  applyReactor(newSaving);
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _ttsAudio = null;

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('tts-btn');
  btn.textContent = ttsEnabled ? '🔊 TTS: ON' : '🔊 TTS';
  btn.className   = ttsEnabled ? 'on' : '';
}

function _snippet(text) {
  const m = text.match(/^[^.!?\n]{1,100}[.!?]?/);
  return (m ? m[0] : text.slice(0, 100)).trim();
}

async function speak(text) {
  if (!ttsEnabled || !text) return;
  if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
  try {
    const resp = await fetch('/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: _snippet(text) }),
    });
    if (!resp.ok) return;
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    _ttsAudio  = new Audio(url);
    _ttsAudio.play();
    _ttsAudio.onended = () => { URL.revokeObjectURL(url); _ttsAudio = null; };
  } catch {}
}

// ── Voice (HTTPS only) ────────────────────────────────────────────────────────
const voiceBtn  = document.getElementById('voice-btn');
const voiceHint = document.getElementById('voice-hint');

async function startRecording() {
  if (!IS_HTTPS || _streaming || _mediaRec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _recMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
             : MediaRecorder.isTypeSupported('audio/mp4')              ? 'audio/mp4' : '';
    _mediaRec    = new MediaRecorder(stream, _recMime ? { mimeType: _recMime } : {});
    _audioChunks = [];
    _mediaRec.ondataavailable = e => { if (e.data.size > 0) _audioChunks.push(e.data); };
    _mediaRec.start();
    voiceBtn.classList.add('listening');
    voiceHint.textContent = '듣는 중…';
  } catch {
    voiceHint.textContent = '마이크 권한 필요';
    setTimeout(() => { voiceHint.textContent = 'HOLD TO SPEAK'; }, 2500);
  }
}

async function stopRecording() {
  if (!_mediaRec || _mediaRec.state === 'inactive') return;
  voiceBtn.classList.remove('listening');
  voiceHint.textContent = '전사 중…';

  await new Promise(resolve => {
    _mediaRec.onstop = resolve;
    _mediaRec.stop();
    _mediaRec.stream.getTracks().forEach(t => t.stop());
  });
  _mediaRec = null;

  const mime = _recMime.includes('mp4') ? 'audio/mp4' : 'audio/webm';
  const ext  = mime === 'audio/mp4' ? 'voice.mp4' : 'voice.webm';
  const blob = new Blob(_audioChunks, { type: mime });

  try {
    const fd = new FormData();
    fd.append('audio', blob, ext);
    const resp = await fetch('/stt', { method: 'POST', body: fd });
    if (!resp.ok) throw new Error(resp.status);
    const { text } = await resp.json();
    voiceHint.textContent = 'HOLD TO SPEAK';
    if (text) sendMsg(text);
    else voiceHint.textContent = '인식 실패';
  } catch {
    voiceHint.textContent = 'STT 오류';
    setTimeout(() => { voiceHint.textContent = 'HOLD TO SPEAK'; }, 2500);
  }
}

if (IS_HTTPS) {
  voiceBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
  voiceBtn.addEventListener('touchend',   e => { e.preventDefault(); stopRecording(); });
  voiceBtn.addEventListener('mousedown',  () => startRecording());
  voiceBtn.addEventListener('mouseup',    () => stopRecording());
}
</script>
