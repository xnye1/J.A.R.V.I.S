<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000814">
<title>JARVIS Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── Reset ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #000814;
  --cyan:   #00d4ff;
  --violet: #7c3aed;
  --panel:  rgba(0,14,32,0.84);
  --border: rgba(0,212,255,0.16);
  --text:   #c8d8e8;
  --muted:  #3a5272;
  --alert:  #ef4444;
  --green:  #22c55e;
  --amber:  #f59e0b;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  overflow: hidden; -webkit-text-size-adjust: 100%;
}

/* ── Background: grid + scanlines ─────────────────────────────────────────── */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.028) 1px, transparent 1px);
  background-size: 48px 48px;
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: repeating-linear-gradient(
    0deg, rgba(0,0,0,0.055) 0px, rgba(0,0,0,0.055) 1px,
    transparent 1px, transparent 3px
  );
}

/* ── App shell ────────────────────────────────────────────────────────────── */
#app {
  display: flex; flex-direction: column; height: 100dvh;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  position: relative; z-index: 10;
}

/* ── Top bar ──────────────────────────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: rgba(0,4,14,0.72); backdrop-filter: blur(20px);
  box-shadow: 0 1px 0 rgba(0,212,255,0.1);
}
.brand {
  font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 900; letter-spacing: 5px;
  background: linear-gradient(90deg, var(--cyan) 0%, #a78bfa 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.brand-sub {
  font-size: 7px; letter-spacing: 4px; color: var(--muted);
  font-family: 'Orbitron', monospace; margin-top: 1px;
  -webkit-text-fill-color: var(--muted);
}
.status-row { display: flex; align-items: center; gap: 8px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--alert); flex-shrink: 0; }
.dot.on { background: var(--green); box-shadow: 0 0 7px var(--green); animation: blink 2.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
#conn-label { font-size: 7px; letter-spacing: 2px; color: var(--muted); }
#chip-mode {
  font-family: 'Orbitron', monospace; font-size: 7px; letter-spacing: 2px; font-weight: 700;
  padding: 2px 7px; border-radius: 3px;
  background: rgba(0,212,255,0.07); border: 1px solid var(--border); color: var(--cyan);
}
#chip-mode.sim { color: var(--amber); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.07); }

/* ── Chat feed ────────────────────────────────────────────────────────────── */
#feed-wrap { flex: 1; overflow-y: auto; padding: 10px 14px; scrollbar-width: none; }
#feed-wrap::-webkit-scrollbar { display: none; }
#feed { display: flex; flex-direction: column; gap: 10px; }

.msg-block { display: flex; flex-direction: column; gap: 3px; }
.msg-who { font-size: 7px; letter-spacing: 2px; padding: 0 5px; font-family: 'Orbitron', monospace; }
.msg-who.j { color: var(--cyan); }
.msg-who.u { color: #a78bfa; text-align: right; }
.msg-who.s { color: var(--muted); text-align: center; }
.msg-text {
  font-size: 13px; line-height: 1.72; padding: 10px 13px;
  word-break: break-word; backdrop-filter: blur(10px);
}
.msg-text.j {
  background: rgba(0,212,255,0.05); border: 1px solid rgba(0,212,255,0.13);
  border-left: 2px solid rgba(0,212,255,0.55);
  border-radius: 2px 12px 12px 12px;
}
.msg-text.u {
  background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2);
  border-right: 2px solid rgba(124,58,237,0.55);
  border-radius: 12px 2px 12px 12px; color: #c4b5fd;
}
.msg-text.s {
  background: rgba(255,255,255,0.02); color: var(--muted);
  font-size: 11px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.05); text-align: center;
}
.stream-cursor {
  display: inline-block; width: 2px; height: 0.88em;
  background: var(--cyan); margin-left: 2px; vertical-align: text-bottom;
  animation: cur-blink 0.55s ease-in-out infinite;
}
@keyframes cur-blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── Weather strip ────────────────────────────────────────────────────────── */
#weather-strip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 4px 14px; font-size: 9px; color: var(--muted);
  border-bottom: 1px solid rgba(0,212,255,0.06);
  background: rgba(0,212,255,0.018);
}
#weather-strip .wc {
  color: var(--cyan); font-weight: 700;
  font-family: 'Orbitron', monospace; font-size: 10px;
  text-shadow: 0 0 8px rgba(0,212,255,0.4);
}
#weather-strip .wm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Laptop stats ─────────────────────────────────────────────────────────── */
#laptop-stats {
  flex-shrink: 0;
  display: grid; grid-template-columns: repeat(4,1fr); gap: 5px;
  padding: 7px 14px;
}
.stat-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 4px; text-align: center;
  backdrop-filter: blur(16px) saturate(1.2); position: relative; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,212,255,0.06) inset;
}
.stat-card::after {
  content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.4), transparent);
}
.stat-label { font-size: 6px; letter-spacing: 2px; color: var(--muted); font-family: 'Orbitron', monospace; }
.stat-val {
  font-size: 14px; font-weight: 700; color: var(--cyan); margin-top: 2px;
  font-family: 'Orbitron', monospace;
  text-shadow: 0 0 10px rgba(0,212,255,0.55);
}
.stat-val.warn { color: var(--alert); text-shadow: 0 0 10px rgba(239,68,68,0.55); }
.stat-val.ok   { color: var(--green); text-shadow: 0 0 10px rgba(34,197,94,0.55); }

/* ── Voice button ─────────────────────────────────────────────────────────── */
#voice-area {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 6px 0 2px;
}
#voice-btn {
  width: 78px; height: 78px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 38% 30%, rgba(0,212,255,0.22) 0%, rgba(0,8,20,0.97) 65%);
  border: 1.5px solid var(--cyan);
  box-shadow: 0 0 28px rgba(0,212,255,0.25), inset 0 1px 0 rgba(0,212,255,0.12);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  overflow: visible; transition: transform 0.12s, border-color 0.18s, box-shadow 0.18s;
}
.voice-ring {
  position: absolute; inset: -1px; border-radius: 50%;
  border: 1px solid rgba(0,212,255,0.5);
  animation: v-ring 2.2s ease-out infinite;
  pointer-events: none;
}
.voice-ring.r2 { animation-delay: 0.9s; }
@keyframes v-ring {
  0%   { transform: scale(1);   opacity: 0.6; }
  100% { transform: scale(2.4); opacity: 0; }
}
.voice-svg { stroke: var(--cyan); transition: stroke 0.18s; }
#voice-btn.listening {
  border-color: var(--cyan);
  box-shadow: 0 0 40px rgba(0,212,255,0.6);
}
#voice-btn.listening .voice-ring { animation-duration: 1s; }
#voice-btn.disabled { opacity: 0.35; pointer-events: none; }
#voice-btn:active { transform: scale(0.92); }

#voice-hint { font-size: 7px; letter-spacing: 3px; color: var(--muted); font-family: 'Orbitron', monospace; }
#https-note { font-size: 9px; color: var(--amber); letter-spacing: 1px; text-align: center; padding: 4px 16px; display: none; }
#https-note a { color: var(--amber); }

/* ── Quick actions ────────────────────────────────────────────────────────── */
#quick {
  flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  padding: 4px 14px 4px;
}
.qbtn {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(10px); transition: background 0.1s, border-color 0.1s;
}
.qbtn .qi { font-size: 14px; }
.qbtn .ql { font-size: 7px; color: var(--muted); letter-spacing: 1px; transition: color 0.1s; }
.qbtn:active { background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.45); }
.qbtn:active .ql { color: var(--cyan); }
.qbtn.wide { grid-column: span 2; flex-direction: row; gap: 6px; justify-content: center; }
.qbtn.wide .ql { letter-spacing: 2px; color: #a78bfa; font-size: 8px; }
.qbtn.wide:active .ql { color: #c4b5fd; }
.qbtn.wide { border-color: rgba(124,58,237,0.3); }
.qbtn.wide:active { background: rgba(124,58,237,0.1); border-color: rgba(124,58,237,0.5); }

/* ── Controls row ─────────────────────────────────────────────────────────── */
#controls {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  padding: 4px 14px 4px;
}
#reactor-btn {
  flex: 1; background: var(--panel); border: 1px solid rgba(0,212,255,0.22);
  border-radius: 9px; padding: 9px 10px; cursor: pointer;
  font-size: 9px; letter-spacing: 1px; color: var(--cyan);
  font-family: 'Orbitron', monospace;
  -webkit-tap-highlight-color: transparent; user-select: none;
  text-align: center; backdrop-filter: blur(10px);
  transition: background 0.1s;
}
#reactor-btn:active { background: rgba(0,212,255,0.12); }
#tts-btn {
  flex-shrink: 0; background: var(--panel); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 12px; cursor: pointer;
  font-size: 9px; letter-spacing: 1px; color: var(--muted);
  -webkit-tap-highlight-color: transparent; user-select: none;
  backdrop-filter: blur(10px); transition: background 0.1s;
}
#tts-btn.on { color: var(--cyan); border-color: rgba(0,212,255,0.4); }
#tts-btn:active { background: rgba(0,212,255,0.1); }

/* ── Input row ────────────────────────────────────────────────────────────── */
#input-row {
  flex-shrink: 0; display: flex; gap: 8px; align-items: center;
  padding: 6px 14px calc(env(safe-area-inset-bottom,0px) + 8px);
  border-top: 1px solid var(--border);
  background: rgba(0,4,14,0.7); backdrop-filter: blur(14px);
}
#msg-input {
  flex: 1; background: rgba(0,212,255,0.04); color: var(--text);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 11px 15px; font-size: 14px; font-family: inherit;
  outline: none; caret-color: var(--cyan);
  transition: border-color 0.2s, background 0.2s;
}
#msg-input:focus { border-color: rgba(0,212,255,0.45); background: rgba(0,212,255,0.06); }
#msg-input::placeholder { color: var(--muted); }
#send-btn {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--cyan) 0%, #0099c4 100%);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px rgba(0,212,255,0.5);
  transition: transform 0.12s, opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}
#send-btn:active   { transform: scale(0.88); }
#send-btn:disabled { opacity: 0.28; transform: none; cursor: default; }
</style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div id="topbar">
    <div>
      <div class="brand">J.A.R.V.I.S</div>
      <div class="brand-sub">REMOTE CONTROL</div>
    </div>
    <div class="status-row">
      <div id="chip-mode">--</div>
      <div class="dot" id="conn-dot"></div>
      <span id="conn-label">CONNECTING</span>
    </div>
  </div>

  <!-- Chat feed -->
  <div id="feed-wrap"><div id="feed"></div></div>

  <!-- Weather / meal strip -->
  <div id="weather-strip">
    <span class="wc" id="r-temp">--°C</span>
    <span id="r-cond" style="color:var(--muted)">--</span>
    <span class="wm" id="r-meal">급식: --</span>
  </div>

  <!-- Laptop stats -->
  <div id="laptop-stats">
    <div class="stat-card"><div class="stat-label">CPU</div><div class="stat-val" id="ls-cpu">--%</div></div>
    <div class="stat-card"><div class="stat-label">RAM</div><div class="stat-val" id="ls-ram">--%</div></div>
    <div class="stat-card"><div class="stat-label">LAPTOP</div><div class="stat-val" id="ls-bat">--%</div></div>
    <div class="stat-card"><div class="stat-label">DISK</div><div class="stat-val" id="ls-disk">--%</div></div>
  </div>

  <!-- Voice button -->
  <div id="voice-area">
    <div id="voice-btn">
      <div class="voice-ring r1"></div>
      <div class="voice-ring r2"></div>
      <svg class="voice-svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8"  y1="22" x2="16" y2="22"/>
      </svg>
    </div>
    <div id="voice-hint">HOLD TO SPEAK</div>
    <div id="https-note">음성 사용: <a id="https-link" href="#">HTTPS 버전으로 이동</a></div>
  </div>

  <!-- Quick actions -->
  <div id="quick">
    <div class="qbtn" onclick="quickSend('상태 보고해')">
      <span class="qi">📊</span><span class="ql">STATUS</span>
    </div>
    <div class="qbtn" onclick="triggerBriefing('morning')">
      <span class="qi">🌅</span><span class="ql">BRIEFING</span>
    </div>
    <div class="qbtn" onclick="toggleFocus()">
      <span class="qi">🎯</span><span class="ql">FOCUS</span>
    </div>
    <div class="qbtn" onclick="reportGPS()">
      <span class="qi">📍</span><span class="ql">GPS</span>
    </div>
    <div class="qbtn" onclick="resetConv()">
      <span class="qi">🔄</span><span class="ql">CLEAR</span>
    </div>
    <div class="qbtn wide" onclick="sendTestSignal()">
      <span class="qi">⚡</span><span class="ql">HUD CONNECTION TEST</span>
    </div>
  </div>

  <!-- Controls row -->
  <div id="controls">
    <div id="reactor-btn" onclick="toggleReactor()">⚡ REACTOR: ONLINE</div>
    <div id="tts-btn" onclick="toggleTTS()">🔊 TTS</div>
  </div>

  <!-- Text input -->
  <div id="input-row">
    <input id="msg-input" type="text" placeholder="명령을 내리십시오, Sir…"
      enterkeyhint="send" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="send-btn" onclick="sendText()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="#000814" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>
<script>
// ── MARKDOWN STRIP + TYPER ────────────────────────────────────────────────────
function stripMd(s){
  if(!s)return'';
  return String(s)
    .replace(/```[\s\S]*?```/g,'')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/\*([^*]+)\*/g,'$1')
    .replace(/__([^_]+)__/g,'$1')
    .replace(/_([^_]+)_/g,'$1')
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^[>\s]*>\s*/gm,'')
    .replace(/^\s*[-*+]\s+/gm,'• ')
    .replace(/\[OPEN:[^\]]+\]/g,'')
    .trim();
}
class Typer{
  constructor(){this._q='';this._idx=0;this._span=null;this._t=null;this._cb=null;}
  attach(span,scrollCb){this._span=span;this._q='';this._idx=0;this._cb=scrollCb||null;}
  push(raw){
    this._q+=stripMd(raw);
    if(!this._t)this._run();
  }
  _run(){
    if(!this._span||this._idx>=this._q.length){this._t=null;return;}
    this._idx++;
    this._span.textContent=this._q.slice(0,this._idx);
    if(this._cb)this._cb();
    const ch=this._q[this._idx-1];
    const bl=this._q.length-this._idx;
    const base=bl>80?6:bl>20?14:22;
    const d=/[.!?]/.test(ch)?Math.max(base,65):/[,;:]/.test(ch)?Math.max(base,32):base;
    this._t=setTimeout(()=>this._run(),d);
  }
  flush(){
    clearTimeout(this._t);this._t=null;
    if(this._span&&this._idx<this._q.length){this._span.textContent=this._q;this._idx=this._q.length;}
    if(this._cb)this._cb();
  }
}
let _typer = new Typer();

// Auto-redirect HTTP → HTTPS so microphone access works
if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  location.replace('https://' + location.hostname + location.pathname);
}

// ── Connection ────────────────────────────────────────────────────────────────
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
const IS_HTTPS = location.protocol === 'https:';
let ws, reactorOn = true, ttsEnabled = false;
let _streaming = false, _mediaRec = null, _audioChunks = [], _recMime = '';

// ── HTTPS note for voice ──────────────────────────────────────────────────────
if (!IS_HTTPS) {
  const note = document.getElementById('https-note');
  const link = document.getElementById('https-link');
  note.style.display = 'block';
  const httpsUrl = 'https://' + location.hostname + '/remote';
  link.href = httpsUrl; link.textContent = httpsUrl;
  document.getElementById('voice-btn').classList.add('disabled');
  document.getElementById('voice-hint').textContent = 'HTTPS 전용';
}

// ── Feed helpers ──────────────────────────────────────────────────────────────
const feed     = document.getElementById('feed');
const feedWrap = document.getElementById('feed-wrap');

function _nearBottom() {
  return feedWrap.scrollHeight - feedWrap.scrollTop - feedWrap.clientHeight < 80;
}
function scrollToBottom()    { feedWrap.scrollTop = feedWrap.scrollHeight; }
function scrollIfNearBottom() { if (_nearBottom()) scrollToBottom(); }

function addMsg(who, text, cls) {
  const block = document.createElement('div'); block.className = 'msg-block';
  const body = cls === 'j' ? stripMd(text) : text;
  block.innerHTML = `<div class="msg-who ${cls}">${who}</div><div class="msg-text ${cls}">${body}</div>`;
  feed.appendChild(block);
  scrollIfNearBottom();
}

function createStreamBubble() {
  const block = document.createElement('div'); block.className = 'msg-block';
  const who   = document.createElement('div'); who.className = 'msg-who j'; who.textContent = 'JARVIS';
  const wrap  = document.createElement('div'); wrap.className = 'msg-text j';
  const span  = document.createElement('span');
  const cur   = document.createElement('span'); cur.className = 'stream-cursor';
  wrap.appendChild(span); wrap.appendChild(cur);
  block.appendChild(who); block.appendChild(wrap);
  feed.appendChild(block);
  scrollIfNearBottom();
  _typer.attach(span, scrollIfNearBottom);
  return { span, cur };
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connect() {
  ws = new WebSocket(WS_URL);
  const dot = document.getElementById('conn-dot');
  const lbl = document.getElementById('conn-label');

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'register', device: 'remote' }));
    dot.className = 'dot on'; lbl.textContent = 'ONLINE';
    _streaming = false;
    document.getElementById('send-btn').disabled = false;
    reportBattery();
    reportGPS();
  };

  ws.onclose = () => {
    dot.className = 'dot'; lbl.textContent = 'OFFLINE';
    setTimeout(connect, 3000);
  };

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);
    if (msg.type === 'connected') {
      const live = !msg.simulation_mode;
      const m = document.getElementById('chip-mode');
      m.textContent = live ? 'LIVE' : 'SIM';
      m.className = live ? '' : 'sim';
      addMsg('JARVIS', 'Neural link established, Sir. Awaiting your command.', 'j');
    } else if (msg.type === 'proactive_alert') {
      addMsg('⚠ ALERT', msg.message, 's');
    } else if (msg.type === 'reactor_state') {
      applyReactor(msg.energy_saving);
    } else if (msg.type === 'laptop_status') {
      updateLaptopStats(msg);
    } else if (msg.type === 'school_update') {
      updateWeatherChip(msg);
    }
  };
}
connect();

// ── Battery ───────────────────────────────────────────────────────────────────
function reportBattery() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then(b => {
    const send = () => {
      if (ws?.readyState === 1)
        ws.send(JSON.stringify({ type: 'remote_status', battery: Math.round(b.level*100), plugged: b.charging }));
    };
    send();
    b.addEventListener('levelchange', send);
    b.addEventListener('chargingchange', send);
  });
}

let _gpsInterval = null;
function reportGPS() {
  if (!navigator.geolocation) { addMsg('SYSTEM', 'GPS 미지원 브라우저', 's'); return; }
  const opts = { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 };
  const send = pos => {
    if (ws?.readyState === 1)
      ws.send(JSON.stringify({ type: 'location', lat: pos.coords.latitude, lon: pos.coords.longitude, source: 'gps' }));
    addMsg('SYSTEM', `GPS ✓ (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`, 's');
  };
  const fail = err => {
    const msg = err.code === 1 ? 'GPS 권한 거부됨 — 설정 > Safari > 위치 허용 필요'
              : err.code === 2 ? 'GPS 신호 없음' : 'GPS 시간 초과';
    addMsg('SYSTEM', msg, 's');
  };
  navigator.geolocation.getCurrentPosition(send, fail, opts);
  // Clear previous interval to prevent accumulation on WS reconnect
  if (_gpsInterval) clearInterval(_gpsInterval);
  _gpsInterval = setInterval(() => navigator.geolocation.getCurrentPosition(send, () => {}, opts), 600000);
}

// ── Laptop stats ──────────────────────────────────────────────────────────────
function updateLaptopStats(d) {
  const set = (id, val, warnThreshold) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = val + '%';
    el.className = 'stat-val' + (val >= warnThreshold ? ' warn' : val < warnThreshold - 30 ? ' ok' : '');
  };
  set('ls-cpu', d.cpu, 85); set('ls-ram', d.ram, 90); set('ls-disk', d.disk, 90);
  const batEl = document.getElementById('ls-bat');
  if (batEl) {
    batEl.textContent = d.bat + (d.plugged ? '%⚡' : '%');
    batEl.className   = 'stat-val' + (d.bat < 20 ? ' warn' : '');
  }
}

// ── Weather / meal chip ───────────────────────────────────────────────────────
function updateWeatherChip(d) {
  const temp = d.temp_c ?? d.temp;
  if (temp !== undefined) document.getElementById('r-temp').textContent = temp + '°C';
  if (d.condition)    document.getElementById('r-cond').textContent = d.condition;
  if (d.meal_preview) document.getElementById('r-meal').textContent = '급식: ' + d.meal_preview;
}

// ── Send (streaming) ──────────────────────────────────────────────────────────
async function sendMsg(text) {
  text = text.trim();
  if (!text || _streaming) return;
  _streaming = true;
  document.getElementById('send-btn').disabled = true;

  addMsg('YOU', text, 'u');
  scrollToBottom();
  if (ws?.readyState === 1)
    ws.send(JSON.stringify({ type: 'remote_speaking', message: text }));

  const bubble = createStreamBubble();
  let fullReply = '';

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const reader = resp.body.getReader();
    const dec    = new TextDecoder();
    let   buf    = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        try {
          const obj = JSON.parse(p.slice(6));
          if (obj.done) { reader.cancel(); break; }
          fullReply += obj.chunk;
          _typer.push(obj.chunk);
          scrollIfNearBottom();
        } catch {}
      }
    }
  } catch {
    fullReply = '통신 오류가 발생했습니다, Sir.';
    bubble.span.textContent = fullReply;
  }

  _typer.flush(); bubble.cur.remove();
  scrollIfNearBottom();
  speak(fullReply);

  if (ws?.readyState === 1)
    ws.send(JSON.stringify({ type: 'hud_echo', query: text, message: fullReply }));

  _streaming = false;
  document.getElementById('send-btn').disabled = false;
}

function sendText() {
  const inp = document.getElementById('msg-input');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  sendMsg(val);
}

function quickSend(text) { sendMsg(text); }

async function triggerBriefing(trigger = 'morning') {
  addMsg('SYSTEM', '브리핑 요청 중…', 's');
  try {
    const resp = await fetch(`/proactive/trigger?trigger=${trigger}`, { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    addMsg('SYSTEM', 'JARVIS 브리핑이 전송되었습니다, Sir.', 's');
  } catch { addMsg('SYSTEM', '브리핑 요청 실패', 's'); }
}

async function toggleFocus() {
  try {
    const resp = await fetch('/focus/toggle', { method: 'POST' });
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    const on = d.toggled === 'on';
    if (ws?.readyState === 1)
      ws.send(JSON.stringify({ type: on ? 'focus_start' : 'focus_end', minutes: 25 }));
    addMsg('SYSTEM', on ? '포모도로 25분 집중 세션 시작, Sir.' : '집중 세션 종료, Sir.', 's');
  } catch { quickSend('집중 모드 시작해줘'); }
}

function sendTestSignal() {
  if (ws?.readyState !== 1) { addMsg('SYSTEM', 'WS 연결이 없습니다.', 's'); return; }
  ws.send(JSON.stringify({ type: 'test_signal' }));
  addMsg('SYSTEM', 'Test signal → HUD.', 's');
}

async function resetConv() {
  await fetch('/reset', { method: 'POST' });
  feed.innerHTML = '';
  addMsg('SYSTEM', 'Conversation cleared, Sir.', 's');
}

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendText();
});

// ── Reactor ───────────────────────────────────────────────────────────────────
function applyReactor(energySaving) {
  reactorOn = !energySaving;
  const btn = document.getElementById('reactor-btn');
  btn.textContent = energySaving ? '⚡ REACTOR: SAVING' : '⚡ REACTOR: ONLINE';
  btn.style.color       = energySaving ? 'var(--amber)' : 'var(--cyan)';
  btn.style.borderColor = energySaving ? 'rgba(245,158,11,0.4)' : 'rgba(0,212,255,0.22)';
}

function toggleReactor() {
  const newSaving = reactorOn;
  if (ws?.readyState === 1)
    ws.send(JSON.stringify({ type: 'reactor_toggle', energy_saving: newSaving }));
  applyReactor(newSaving);
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _ttsAudio = null;

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('tts-btn');
  btn.textContent = ttsEnabled ? '🔊 TTS: ON' : '🔊 TTS';
  btn.className   = ttsEnabled ? 'on' : '';
}

function _snippet(text) {
  const m = text.match(/^[^.!?\n]{1,100}[.!?]?/);
  return (m ? m[0] : text.slice(0, 100)).trim();
}

async function speak(text) {
  if (!ttsEnabled || !text) return;
  if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
  try {
    const resp = await fetch('/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: _snippet(text) }),
    });
    if (!resp.ok) return;
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    _ttsAudio  = new Audio(url);
    _ttsAudio.play();
    _ttsAudio.onended = () => { URL.revokeObjectURL(url); _ttsAudio = null; };
  } catch {}
}

// ── Voice (HTTPS only) ────────────────────────────────────────────────────────
const voiceBtn  = document.getElementById('voice-btn');
const voiceHint = document.getElementById('voice-hint');

async function startRecording() {
  if (!IS_HTTPS || _streaming || _mediaRec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _recMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
             : MediaRecorder.isTypeSupported('audio/mp4')              ? 'audio/mp4' : '';
    _mediaRec    = new MediaRecorder(stream, _recMime ? { mimeType: _recMime } : {});
    _audioChunks = [];
    _mediaRec.ondataavailable = e => { if (e.data.size > 0) _audioChunks.push(e.data); };
    _mediaRec.start();
    voiceBtn.classList.add('listening');
    voiceHint.textContent = '듣는 중…';
  } catch {
    voiceHint.textContent = '마이크 권한 필요';
    setTimeout(() => { voiceHint.textContent = 'HOLD TO SPEAK'; }, 2500);
  }
}

async function stopRecording() {
  if (!_mediaRec || _mediaRec.state === 'inactive') return;
  voiceBtn.classList.remove('listening');
  voiceHint.textContent = '전사 중…';

  await new Promise(resolve => {
    _mediaRec.onstop = resolve;
    _mediaRec.stop();
    _mediaRec.stream.getTracks().forEach(t => t.stop());
  });
  _mediaRec = null;

  const mime = _recMime.includes('mp4') ? 'audio/mp4' : 'audio/webm';
  const ext  = mime === 'audio/mp4' ? 'voice.mp4' : 'voice.webm';
  const blob = new Blob(_audioChunks, { type: mime });

  try {
    const fd = new FormData();
    fd.append('audio', blob, ext);
    const resp = await fetch('/stt', { method: 'POST', body: fd });
    if (!resp.ok) throw new Error(resp.status);
    const { text } = await resp.json();
    voiceHint.textContent = 'HOLD TO SPEAK';
    if (text) sendMsg(text);
    else voiceHint.textContent = '인식 실패';
  } catch {
    voiceHint.textContent = 'STT 오류';
    setTimeout(() => { voiceHint.textContent = 'HOLD TO SPEAK'; }, 2500);
  }
}

if (IS_HTTPS) {
  voiceBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
  voiceBtn.addEventListener('touchend',   e => { e.preventDefault(); stopRecording(); });
  voiceBtn.addEventListener('mousedown',  () => startRecording());
  voiceBtn.addEventListener('mouseup',    () => stopRecording());
}
</script>
