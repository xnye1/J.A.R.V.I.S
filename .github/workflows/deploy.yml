name: JARVIS — Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: true  # cancel queued deploy if a newer push lands

env:
  # Non-sensitive — already public in CLAUDE.md / codebase
  SERVER_IP:   "158.180.78.104"
  SERVER_USER: "ubuntu"
  SERVER_PORT: "8000"
  REPO_DIR:    "/opt/jarvis"

jobs:
  deploy:
    name: Deploy to Oracle Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Validate required secret ───────────────────────────────────────────
      - name: Check SSH key secret
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set."
            echo "::error::Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "::error::Add secret: SSH_PRIVATE_KEY = contents of your Oracle VM private key"
            exit 1
          fi
          echo "SSH_PRIVATE_KEY secret present — proceeding."

      # ── 3. SSH deploy ─────────────────────────────────────────────────────────
      - name: SSH → Pull & Rebuild
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          timeout:  10m
          script: |
            set -euo pipefail

            echo "=== JARVIS Deploy: $(date -u) ==="
            echo "Actor  : ${{ github.actor }}"
            echo "Commit : ${{ github.sha }}"
            echo "Msg    : ${{ github.event.head_commit.message }}"
            echo "======================================="

            cd /opt/jarvis

            # Pull latest code
            git fetch --all --prune
            git reset --hard origin/main

            # Rebuild and restart containers
            sudo docker compose up -d --build --remove-orphans

            # Remove dangling images to reclaim disk
            sudo docker image prune -f

            echo "=== Deploy OK: $(date -u) ==="

      # ── 4. Notify JARVIS HUD via webhook ──────────────────────────────────────
      - name: Notify HUD
        if: success()
        run: |
          sleep 5

          WEBHOOK_SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "http://${{ env.SERVER_IP }}:${{ env.SERVER_PORT }}/deploy-notify" \
            -H "X-Deploy-Token: ${WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 10 \
            -d "{
              \"commit\":  \"${{ github.sha }}\",
              \"message\": \"SYSTEM UPDATED: ${{ github.event.head_commit.message }}\",
              \"actor\":   \"${{ github.actor }}\"
            }")

          echo "HUD webhook HTTP status: ${HTTP_STATUS}"
          [ "${HTTP_STATUS}" = "200" ] && echo "HUD notified OK." || echo "HUD notification skipped (server may be restarting)."

      # ── 5. Failure notification ───────────────────────────────────────────────
      - name: Notify HUD on failure
        if: failure()
        run: |
          curl -s -X POST "http://${{ env.SERVER_IP }}:${{ env.SERVER_PORT }}/deploy-notify" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 10 \
            -d "{
              \"commit\":  \"${{ github.sha }}\",
              \"message\": \"DEPLOY FAILED — manual intervention required\",
              \"actor\":   \"${{ github.actor }}\",
              \"failed\":  true
            }" || true
