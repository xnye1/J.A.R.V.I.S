name: JARVIS — Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SERVER_IP:   "158.180.78.104"
  SERVER_USER: "ubuntu"
  SERVER_PORT: "8000"
  DEPLOY_DIR:  "/opt/jarvis"

jobs:
  deploy:
    name: Deploy to Oracle Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Check secret ───────────────────────────────────────────────────────
      - name: Check SSH secret
        run: |
          if [ -z "${{ secrets.JARVIS }}" ]; then
            echo "::error::JARVIS secret (SSH private key) is not set."
            exit 1
          fi
          echo "Secret present — proceeding."

      # ── 3. Upload files via SCP ───────────────────────────────────────────────
      - name: Upload code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key:      ${{ secrets.JARVIS }}
          port:     22
          source:   "backend/,docker-compose.yml,requirements.txt"
          target:   ${{ env.DEPLOY_DIR }}
          strip_components: 0
          rm: false

      # ── 4. Rebuild Docker on server ───────────────────────────────────────────
      - name: Rebuild & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key:      ${{ secrets.JARVIS }}
          port:     22
          timeout:  10m
          script: |
            set -e
            cd /opt/jarvis
            echo "=== JARVIS Deploy: $(date -u) ==="
            echo "Commit: ${{ github.sha }}"
            echo "By:     ${{ github.actor }}"

            sudo docker compose up -d --build --remove-orphans
            sudo docker image prune -f
            sleep 6
            sudo docker ps --format 'table {{.Names}}\t{{.Status}}'
            echo "=== Done ==="

      # ── 5. Health check ───────────────────────────────────────────────────────
      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3; do
            RESP=$(curl -sf --max-time 12 "http://${{ env.SERVER_IP }}:${{ env.SERVER_PORT }}/health" \
                   || echo '{"alive":false}')
            echo "[$i] $RESP"
            echo "$RESP" | grep -q '"alive":true' && exit 0
            sleep 8
          done
          echo "::error::Health check failed"
          exit 1

      # ── 6. Notify HUD ─────────────────────────────────────────────────────────
      - name: Notify HUD
        if: success()
        run: |
          curl -s -X POST "http://${{ env.SERVER_IP }}:${{ env.SERVER_PORT }}/deploy-notify" \
            -H "Content-Type: application/json" \
            --max-time 10 \
            -d "{\"commit\":\"${{ github.sha }}\",\"message\":\"${{ github.event.head_commit.message }}\",\"actor\":\"${{ github.actor }}\"}" \
            || echo "HUD notify skipped (non-critical)"
          echo "Core system restored, Sir. All neural pathways nominal."
