name: JARVIS — Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SERVER_IP:   "158.180.78.104"
  SERVER_USER: "ubuntu"
  SERVER_PORT: "8000"
  DEPLOY_DIR:  "/opt/jarvis"

jobs:
  deploy:
    name: Deploy to Oracle Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Setup SSH key (strip Windows CRLF — the #1 cause of auth failure) ──
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # printf preserves exact content; tr -d '\r' kills CRLF
          printf '%s' "${{ secrets.JARVIS }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          # Verify key is valid
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "✅ Key valid" || (echo "❌ Key invalid — check JARVIS secret" && exit 1)

      # ── 3. Upload files via SCP ───────────────────────────────────────────────
      - name: Upload code
        run: |
          scp -i ~/.ssh/deploy_key -r \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            backend docker-compose.yml requirements.txt \
            ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.DEPLOY_DIR }}/
          echo "✅ Files uploaded"

      # ── 3.5 Inject environment secrets into server .env ──────────────────────
      - name: Inject env secrets
        run: |
          touch /tmp/jarvis_inject.env

          # ── LLM provider selection ──────────────────────────────────────────
          GROQ_KEY='${{ secrets.GROQ_API_KEY }}'
          TOGETHER_KEY='${{ secrets.TOGETHER_API_KEY }}'
          GEMINI_KEY='${{ secrets.GEMINI_API_KEY }}'

          if [ -n "$GROQ_KEY" ]; then
            printf 'LLM_PROVIDER=groq\n'    >> /tmp/jarvis_inject.env
            printf 'GROQ_API_KEY=%s\n' "$GROQ_KEY" >> /tmp/jarvis_inject.env
            echo "✅ GROQ_API_KEY queued (provider=groq)"
          elif [ -n "$TOGETHER_KEY" ]; then
            printf 'LLM_PROVIDER=together\n' >> /tmp/jarvis_inject.env
            printf 'TOGETHER_API_KEY=%s\n' "$TOGETHER_KEY" >> /tmp/jarvis_inject.env
            echo "✅ TOGETHER_API_KEY queued (provider=together)"
          elif [ -n "$GEMINI_KEY" ]; then
            printf 'LLM_PROVIDER=gemini\n'  >> /tmp/jarvis_inject.env
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_KEY" >> /tmp/jarvis_inject.env
            echo "✅ GEMINI_API_KEY queued (provider=gemini, legacy)"
          else
            echo "⚠ No LLM API key set — JARVIS will run in simulation mode"
          fi

          # ── Voice engine ───────────────────────────────────────────────────
          EL_KEY='${{ secrets.ELEVENLABS_API_KEY }}'
          if [ -n "$EL_KEY" ]; then
            printf 'ELEVENLABS_API_KEY=%s\n' "$EL_KEY" >> /tmp/jarvis_inject.env
            echo "✅ ELEVENLABS_API_KEY queued"
          else
            echo "⚠ ELEVENLABS_API_KEY not set — voice engine in fallback mode"
          fi

          if [ -s /tmp/jarvis_inject.env ]; then
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              /tmp/jarvis_inject.env \
              ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:/tmp/jarvis_inject.env
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} \
              "touch ${{ env.DEPLOY_DIR }}/.env && \
               sed -i '/^LLM_PROVIDER=/d'      ${{ env.DEPLOY_DIR }}/.env && \
               sed -i '/^GROQ_API_KEY=/d'      ${{ env.DEPLOY_DIR }}/.env && \
               sed -i '/^TOGETHER_API_KEY=/d'  ${{ env.DEPLOY_DIR }}/.env && \
               sed -i '/^GEMINI_API_KEY=/d'    ${{ env.DEPLOY_DIR }}/.env && \
               sed -i '/^ELEVENLABS_API_KEY=/d' ${{ env.DEPLOY_DIR }}/.env && \
               cat /tmp/jarvis_inject.env >> ${{ env.DEPLOY_DIR }}/.env && \
               rm /tmp/jarvis_inject.env && \
               echo '✅ Secrets injected into server .env'"
            rm -f /tmp/jarvis_inject.env
          fi

      # ── 4. Rebuild Docker ─────────────────────────────────────────────────────
      - name: Rebuild & restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} \
            "set -e
             echo '=== JARVIS Deploy: '\$(date -u)' ==='
             echo 'Commit: ${{ github.sha }}'
             echo 'By:     ${{ github.actor }}'
             cd ${{ env.DEPLOY_DIR }}
             sudo docker compose up -d --build --remove-orphans 2>&1 | tail -6
             sudo docker image prune -f >/dev/null
             sleep 6
             sudo docker ps --format 'table {{.Names}}\t{{.Status}}'
             echo '=== Done ==='"

      # ── 5. Health check ───────────────────────────────────────────────────────
      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3; do
            RESP=$(curl -sf --max-time 12 "http://${{ env.SERVER_IP }}:${{ env.SERVER_PORT }}/health" \
                   || echo '{"alive":false}')
            echo "[$i] $RESP"
            echo "$RESP" | grep -q '"alive":true' && exit 0
            sleep 8
          done
          echo "::error::Health check failed after 3 attempts"
          exit 1

      # ── 6. Notify HUD ─────────────────────────────────────────────────────────
      - name: Notify HUD
        if: success()
        run: |
          curl -sf -X POST "http://${{ env.SERVER_IP }}:${{ env.SERVER_PORT }}/deploy-notify" \
            -H "Content-Type: application/json" \
            --max-time 10 \
            -d "{\"commit\":\"${{ github.sha }}\",\"message\":\"${{ github.event.head_commit.message }}\",\"actor\":\"${{ github.actor }}\"}" \
            && echo "✅ HUD notified" || echo "HUD notify skipped (non-critical)"
          echo "Core system restored, Sir. All neural pathways nominal."
